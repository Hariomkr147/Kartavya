openapi: 3.0.3

info:
  title: Kartavya API
  version: 3.0.0
  description: >
    # Kartavya — A Gamified Civic Upkeep Platform


    This is the full API contract for Kartavya. It is written so that the
    frontend team can build against fake responses before the backend is
    finished, and so that every endpoint maps clearly to a user story from
    Milestone 1.


    ## How to read this document


    - Every path has a plain-English description of *what it does* and *who is
      allowed to call it*.

    - Request and response shapes are fully defined under `components/schemas`,
      so nothing is left as "implementation-defined".

    - The complaint lifecycle is enforced by the server. The allowed statuses
      and the rules for moving between them are described on the
      `ComplaintStatus` schema and on the status-changing endpoints.

    - AI features (photo pre-screening, zone health report) are designed to fail
      softly. If the local AI model is down, the app still works — the relevant
      fields just come back empty or flagged as unavailable.

    - Category selection is deliberately **not** an AI feature. The 12
      categories are seeded once and never change, so the client matches a
      description against a fixed keyword lexicon offline; there is no
      suggestion endpoint and nothing to fail. `Category.code` is the stable key
      that lexicon is written against.


    ## Roles at a glance


    - **Citizen** — files complaints, tracks them, upvotes, confirms fixes,
      earns points and badges. Sees only their own data plus an anonymized
      public feed for their zone.

    - **Officer** — works a single assigned zone. Reviews evidence, moves
      complaints through the lifecycle, posts progress notes. Never sees who
      filed a complaint, and never sees other zones or admins.

    - **Admin** — full access across all zones. Manages accounts and SLAs,
      views analytics, exports data, triggers AI zone reports. Invisible to
      everyone else.


    ## Authentication


    All endpoints require a JWT in the `Authorization: Bearer <token>` header,
    **except** the few marked as public (registration, login, the reference
    lists needed to fill the registration form, and the signed photo route
    described below).


    Tokens are short-lived and **there is no refresh endpoint**. `AuthResponse`
    reports `expiresAt`; once that moment passes the server answers `401` and
    the client sends the user back to the login screen. This is deliberate —
    a refresh flow is state the project does not need, and re-login is cheap
    for a single-device civic app.


    ## Photos


    Photos are never inlined and never served from a browsable directory. Any
    response field named `photoUrl` is a **pre-signed, expiring link** to
    `GET /evidence/{evidenceId}/photo`, minted by the server at the moment it
    serialises the response, for a caller it has already authorised to see the
    parent complaint. Clients treat it as an opaque string and drop it into an
    `<img src>`; they never construct it, and they must not persist it beyond
    the life of the response that carried it.

  contact:
    name: Kartavya Project Manager (Shreyan)
    url: https://github.com/thethinkmachine/

servers:
  - url: /api/v1
    description: >
      Version 1 of the Kartavya API. Note: the URL segment `v1` is the API's
      major version (unchanged, since nothing is deployed yet), while
      `info.version` (2.0.0) is the revision number of this contract document.
      A breaking change to the API would introduce `/api/v2`.

tags:
  - name: Authentication
    description: Account creation and login. These are the only endpoints a user can reach without a token.
  - name: Account
    description: Self-service profile actions available to any authenticated role (citizen, officer, or admin) about their own account.
  - name: Reference
    description: Fixed lookup data (the 12 categories and the list of zones). Public so the registration form can use them.
  - name: Complaints
    description: Creating, viewing, and acting on individual complaints (citizen-facing actions).
  - name: Feed
    description: The anonymized public complaint feed for a citizen's zone.
  - name: Officer
    description: Zone-scoped actions for officers — queue, evidence review, status changes, progress notes, zone analytics.
  - name: Admin
    description: Cross-zone management — users, SLAs, analytics, AI reports, CSV export, overrides, settings.
  - name: Shared
    description: Operations available to both officers and administrators.
  - name: Gamification
    description: Citizen points, badges, and leaderboards.
  - name: Officers (Public)
    description: The small, citizen-safe view of an officer's public statistics.

# Every endpoint requires a JWT by default. Public endpoints override this with `security: []`.
security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerCitizen
      summary: Register a new citizen
      description: >
        Creates a **citizen** account. This is the only self-service signup in
        the system. Officers and admins are never created here — officers are
        created by an admin, and admins are seeded directly into the database.


        The citizen must pick the zone they live in or report from. Use
        `GET /zones` (which is public) to populate that dropdown.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Citizen account created. A token is returned so the user is logged in immediately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Log in (any role)
      description: >
        Authenticates a citizen, officer, or admin by email and password and
        returns a JWT plus the basic profile needed to route them to the right
        dashboard. Deactivated accounts are rejected here with a 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong email/password, or the account is deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # ACCOUNT (self-service, any authenticated role)
  # ---------------------------------------------------------------------------

  /users/me:
    get:
      tags: [Account]
      operationId: getMyProfile
      summary: Get my own profile
      description: >
        Returns the calling user's own profile — citizen, officer, or admin.
        Includes `displayName`, which otherwise has no API exposure at all
        (not even to an admin editing someone else via
        `PATCH /admin/users/{userId}`). Also gives the frontend a way to
        refresh "who am I" after a page reload or a profile edit, rather
        than relying on decoded JWT claims for anything beyond routing
        (id/role).
      responses:
        "200":
          description: Your profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Account]
      operationId: updateMyProfile
      summary: Edit my own profile
      description: >
        Self-service edit of `displayName`, `name`, and `email`. All fields
        optional — send only what changes.


        `zoneId` is accepted **only for a CITIZEN** caller, changing their
        home zone (informational — it only affects the feed's default zone
        and future complaints' zone-picker prefill, never past complaints,
        which snapshot their own `zoneId` at submission time). An
        **OFFICER** sending `zoneId` gets `403`: an officer's zone is a work
        assignment, not a preference, and must go through
        `PATCH /admin/users/{userId}` or
        `POST /admin/zones/{zoneId}/assign-officer` — both of which clear
        `assignedOfficerId` on that officer's now-inaccessible complaints in
        the old zone. A self-service path here would silently skip that
        cleanup, leaving complaints assigned to an officer who can no longer
        see them.


        Password changes are **not** handled here — see
        `POST /users/me/change-password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: A non-citizen (OFFICER or ADMIN) attempted to change their own zoneId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new email is already taken by another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/me/change-password:
    post:
      tags: [Account]
      operationId: changeMyPassword
      summary: Change my own password
      description: >
        Requires the current password. Deliberately kept separate from
        `PATCH /users/me` so a password change always re-confirms identity,
        rather than riding along with an unrelated profile field update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: No valid token, or currentPassword is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # REFERENCE DATA (public)
  # ---------------------------------------------------------------------------

  /categories:
    get:
      tags: [Reference]
      operationId: getCategories
      summary: Get the 12 fixed complaint categories
      description: >
        Returns the fixed list of 12 civic categories, each with its current
        SLA target time in hours. The category list itself cannot be changed
        from inside the app. The SLA target *can* be changed by an admin via
        `PATCH /admin/slas/{categoryId}`, and this endpoint always reflects the
        current value — so it doubles as the "read SLA targets" endpoint.
      security: []
      responses:
        "200":
          description: The category list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /zones:
    get:
      tags: [Reference]
      operationId: getZones
      summary: Get all zones
      description: >
        Returns every zone (admin-created areas, e.g. "Ward 12 – North"). This
        is **public** because the registration form needs it before the user
        has a token.
      security: []
      responses:
        "200":
          description: The list of zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"

  /zones/suggest:
    post:
      tags: [Reference]
      operationId: suggestZone
      summary: Suggest the nearest zone for a location
      description: >
        Given a latitude/longitude (typically read from a photo's EXIF GPS),
        returns the single nearest **active** zone by centre distance —
        deactivated zones are excluded from matching, so this never pre-fills
        a zone that `POST /complaints` would then reject. The complaint form
        uses this to **pre-fill** the zone picker so the citizen usually just
        confirms instead of scrolling. It is advisory only — the citizen can
        always change the pick, and the server never routes on this alone.
        Because it matches the *nearest active* centre, it always returns one
        zone (there are no gaps or overlaps to fall into) unless every zone
        in the system happens to be deactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneSuggestionRequest"
      responses:
        "200":
          description: The nearest zone (or null if none could be determined).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneSuggestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # COMPLAINTS (citizen-facing)
  # ---------------------------------------------------------------------------

  /complaints:
    post:
      tags: [Complaints]
      operationId: createComplaint
      summary: File a new complaint
      description: >
        A citizen files a complaint by choosing one of the 12 categories,
        uploading 1 to 3 photos (JPEG or PNG, max 5 MB each), and sharing a
        location (latitude/longitude).


        On submission the server automatically:

        - routes the complaint to the citizen-confirmed `zoneId` (validated
          active, never re-derived from location),

        - sets the status to `SUBMITTED`,

        - stores each photo as its own evidence record (`sequence` 1, 2, 3…)
          and kicks off AI photo pre-screening for each one independently in
          the background (non-blocking — each confidence note is attached to
          its evidence record when ready; an officer's evidence-review
          verdict still applies once, to the whole round, not per photo),

        - checks for nearby open complaints of the same category (Haversine,
          ~50–100 m) and links them into a cluster, recomputing severity.


        None of those steps block the response. If the AI model is down, the
        complaint is still created normally.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateComplaintRequest"
      responses:
        "201":
          description: Complaint created and routed to a zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          description: Missing required field, wrong file type/size, or a submitted zoneId that doesn't exist or is deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only citizens can file complaints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /complaints/my:
    get:
      tags: [Complaints]
      operationId: getMyComplaints
      summary: Get my complaints (citizen dashboard)
      description: >
        Returns every complaint filed by the logged-in citizen, newest first,
        for their personal dashboard. Each item carries its current status,
        category, severity and SLA labels, and a flag telling the frontend when
        the citizen needs to act (for example, "officer asked for more evidence"
        or "please confirm the fix").
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          description: Optional filter by one or more statuses.
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ComplaintStatus"
        - name: categoryId
          in: query
          description: Optional filter by category.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The citizen's complaints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /complaints/{complaintId}:
    get:
      tags: [Complaints]
      operationId: getComplaintById
      summary: Get one complaint in full
      description: >
        Returns the full detail of a single complaint: description, photo,
        location, evidence (including the AI confidence note and the officer's
        verdict), the complete status history, and all progress notes.


        The response is shaped by role:

        - **Citizen** — only if it is their own complaint (otherwise 403).

        - **Officer** — only if the complaint is in their zone; the reporter's
          identity is stripped out.

        - **Admin** — any complaint, with full detail including the reporter.


        **Zone scoping is evaluated against the officer's zone right now,**
        re-read from their account on every request — never from a zone claim
        baked into the JWT, and never from `assignedOfficerId`. An officer
        moved to another zone loses access to their old zone's complaints
        immediately, including ones they personally worked, and gets `403`
        (the shared "wrong role or wrong zone" answer) rather than `404`. This
        is the same rule that clears `assignedOfficerId` on those complaints
        when an admin reassigns an officer: a complaint is never left assigned
        to someone who can no longer open it. The consequence to design
        around is that an officer's own history is not permanently readable to
        them — `status_history` keeps the audit trail, and an admin can always
        see it.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: The complaint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /complaints/{complaintId}/evidence:
    post:
      tags: [Complaints]
      operationId: submitAdditionalEvidence
      summary: Submit additional evidence (when asked)
      description: >
        Lets the citizen upload a new, clearer photo **only when** their
        complaint is in the `NEEDS_MORE_EVIDENCE` stage. After upload, the
        complaint moves back to `EVIDENCE_UNDER_REVIEW` for the officer to look
        again. The old photo is kept as well — both are retained in the evidence
        history. AI re-screening runs again in the background on the new photo.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceRequest"
      responses:
        "201":
          description: New evidence accepted; complaint returned to evidence review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          description: Wrong file type or size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The complaint is not in the NEEDS_MORE_EVIDENCE stage, so extra evidence cannot be added right now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /complaints/{complaintId}/upvote:
    post:
      tags: [Complaints]
      operationId: upvoteComplaint
      summary: Upvote someone else's complaint
      description: >
        A citizen upvotes a complaint in their zone that is **not their own** and
        **not yet closed**. Each citizen can upvote a given complaint only once.


        An upvote raises the complaint's severity score (and may bump its
        severity label), and credits +5 CSP to the citizen who originally filed
        it.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Upvote recorded. Returns the new upvote count and severity label.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpvoteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: You cannot upvote your own complaint, or a complaint outside your zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You have already upvoted this complaint, or it is already closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /complaints/{complaintId}/confirm:
    post:
      tags: [Complaints]
      operationId: confirmResolution
      summary: Confirm the fix (close the complaint)
      description: >
        The citizen confirms that an issue marked `RESOLVED` by the officer is
        genuinely fixed. **Only the citizen who filed this complaint may call
        this** — anyone else gets `403`. The complaint then moves to `CLOSED`,
        and the system automatically credits points and checks for any newly
        earned badges. Confirming affects this complaint only: other members
        of the same cluster stay exactly where they are until their own
        reporters act (or the auto-close timeout fires).


        **Points:** if this complaint is standalone (no `clusterId`), or it is
        the first complaint in its cluster to be confirmed, the citizen gets
        the full `COMPLAINT_CLOSED` bonus (+50). If another member of the same
        cluster already won that reward, this citizen instead gets a smaller
        `CLUSTER_MEMBER_CLOSED` consolation (+10) — the +50 is paid once per
        cluster, not once per member. Cluster rewards are also paid **at most
        once per citizen per cluster**: if the same citizen filed several
        complaints that were clustered together, only their first successful
        confirm credits points — confirming their remaining duplicates still
        closes those complaints but credits nothing, so filing duplicates
        cannot farm rewards. Either way, the `ON_TIME_BONUS` (+15) is
        evaluated independently against **this complaint's own** SLA snapshot,
        regardless of which reward it received.


        A complaint can only reach `CLOSED` through this confirmation or the
        admin-configured auto-close timeout — and the timeout credits **no
        points at all**, since nobody did the on-site verification work. An
        officer marking it Resolved is never enough on its own.


        **Repeat calls:** this action is only valid while the complaint is in the
        `RESOLVED` stage. Calling it again after the complaint is already
        `CLOSED` returns `409` (it is no longer awaiting confirmation), so the
        action is safe against accidental double-submits.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Complaint closed; points and badges updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The complaint is not in the RESOLVED stage, so it cannot be confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /complaints/{complaintId}/dispute:
    post:
      tags: [Complaints]
      operationId: disputeResolution
      summary: Dispute the fix (reopen the complaint)
      description: >
        The citizen says a `RESOLVED` complaint is not actually fixed. **Only
        the citizen who filed this complaint may call this** — anyone else
        gets `403`. A reason **and a fresh photo are both required** — the
        burden of proof is on the citizen, the same as when the complaint was
        first filed. The photo is appended to the complaint's evidence
        history (next `sequence`); it is not routed through an officer's
        evidence-review verdict. The complaint moves to `REOPENED` and goes
        back to the queue with the citizen's reason and photo attached. No
        points are credited.


        **Review:** unlike the original complaint, an officer can no longer
        pick a `REOPENED` complaint back up directly. An admin renders a
        verdict via `POST /admin/complaints/{complaintId}/dispute-review`
        first — only if the dispute is upheld does it return to the officer's
        queue (`IN_PROGRESS`); if rejected, it goes straight to `CLOSED` with
        no points credited, same as an auto-close.


        **Clusters:** disputing affects **this complaint only**, and the
        complaint **stays in its cluster** — `clusterId` is never cleared.
        Other members keep whatever status they have (already-`CLOSED`
        members stay closed), so a cluster may hold members at different
        stages; the cluster's overall state is always derived from its
        members' statuses, never stored. When the officer re-fixes the issue
        after an admin upholds the dispute — by working this complaint
        directly (`IN_PROGRESS` → … → `RESOLVED`), or by resolving any other
        still-open member, whose cascade then returns this one to `RESOLVED`
        too — the citizen is simply asked to confirm again. Because
        membership is permanent, the one-time +50 cluster reward can never be
        re-fired by this dispute-and-refix loop.


        **Repeat calls:** valid only while the complaint is in the `RESOLVED`
        stage. Once it has moved to `REOPENED`, a second dispute returns `409`,
        protecting against accidental double-submits.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DisputeRequest"
      responses:
        "200":
          description: Complaint reopened, evidence attached, and queued for an admin's dispute-review verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          description: Missing reason or photo, or wrong file type/size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The complaint is not in the RESOLVED stage, so it cannot be disputed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # EVIDENCE PHOTOS (every role, via signed links only)
  # ---------------------------------------------------------------------------

  /evidence/{evidenceId}/photo:
    get:
      tags: [Shared]
      operationId: getEvidencePhoto
      summary: Fetch an evidence photo through its signed link
      description: >
        Serves the image bytes of one `complaint_evidence` row. This is the
        only way a photo leaves the server: the files live outside the web
        root under UUID filenames, and no directory is browsable.


        **Clients never build this URL.** Every response carrying a `photoUrl`
        (`Complaint`, `ComplaintDetail`, `FeedItem`, `Evidence`) already holds
        a complete signed link, and the client's whole job is to put that
        string into an `<img src>`.


        **Why a signature instead of a bearer token.** An `<img>` tag cannot
        send an `Authorization` header, so a bearer-protected photo route
        would force every image in the app through a manual fetch-and-blob
        detour. Instead, when the server serialises `photoUrl` for a caller it
        has *already* authorised to see the parent complaint, it appends `exp`
        and `sig`. The signature is the authorisation: unguessable, expiring,
        and issued only to someone who had legitimate access a moment ago.
        The link discloses nothing beyond the image itself — never the
        reporter's identity — which is what keeps it compatible with the
        anonymised feed.


        **Expiry.** Links are valid for `PHOTO_URL_TTL_SECONDS` (default
        24 h) and are re-minted on every read of the parent resource, so
        normal navigation never shows a broken image. A page left open past
        the TTL gets `403` on the image and should refetch the parent
        resource to obtain fresh links.
      security: []
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
        - name: exp
          in: query
          required: true
          description: Unix timestamp (seconds) after which the link stops working.
          schema:
            type: integer
            format: int64
        - name: sig
          in: query
          required: true
          description: >
            URL-safe base64 HMAC-SHA256 of `{evidenceId}|{exp}` under the
            server's photo-signing secret. Verified in constant time.
          schema:
            type: string
      responses:
        "200":
          description: The image bytes.
          headers:
            Cache-Control:
              description: >
                `private, max-age=<remaining TTL>` — cacheable by the browser
                for exactly as long as the signature stays valid, never by a
                shared proxy.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "403":
          description: >
            The signature is missing, malformed, wrong, or expired. A photo
            that does not exist returns `403` too, not `404` — the response
            must not confirm which evidence IDs are real.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # PUBLIC FEED (citizen)
  # ---------------------------------------------------------------------------

  /feed:
    get:
      tags: [Feed]
      operationId: getPublicFeed
      summary: Browse the public complaint feed
      description: >
        The "Instagram Explore"-style feed for citizens. Shows complaints in the
        citizen's own zone with photo, category, severity label, upvote count,
        location, and status — but **never** who filed them. The location is
        the same latitude/longitude captured at filing time, exposed here so
        the client can show a nearby-landmark hint (e.g. via reverse
        geocoding) — precise enough to find the issue in person, which is the
        point of the feed, but never tied to a reporter identity. By default
        it shows active complaints; closed and rejected ones are hidden
        unless explicitly requested, in which case they are clearly marked.


        Citizens can upvote straight from this feed (subject to the
        one-upvote-per-complaint rule).
      parameters:
        - name: zoneId
          in: query
          description: Defaults to the caller's own zone. Citizens may only request their own zone.
          required: false
          schema:
            type: string
        - name: includeResolved
          in: query
          description: Set to true to also include closed/rejected complaints (clearly marked).
          required: false
          schema:
            type: boolean
            default: false
        - name: categoryId
          in: query
          description: Optional filter by category.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Anonymized feed for the zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only citizens can browse the feed, or a citizen requested a zone that is not theirs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

