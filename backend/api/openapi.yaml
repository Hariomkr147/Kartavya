openapi: 3.0.3

info:
  title: Kartavya API
  version: 2.0.0
  description: >
    # Kartavya — A Gamified Civic Upkeep Platform


    This is the full API contract for Kartavya. It is written so that the
    frontend team can build against fake responses before the backend is
    finished, and so that every endpoint maps clearly to a user story from
    Milestone 1.


    ## How to read this document


    - Every path has a plain-English description of *what it does* and *who is
      allowed to call it*.

    - Request and response shapes are fully defined under `components/schemas`,
      so nothing is left as "implementation-defined".

    - The complaint lifecycle is enforced by the server. The allowed statuses
      and the rules for moving between them are described on the
      `ComplaintStatus` schema and on the status-changing endpoints.

    - AI features (photo pre-screening, category suggestion, zone health report)
      are designed to fail softly. If the local AI model is down, the app still
      works — the relevant fields just come back empty or flagged as
      unavailable.


    ## Roles at a glance


    - **Citizen** — files complaints, tracks them, upvotes, confirms fixes,
      earns points and badges. Sees only their own data plus an anonymized
      public feed for their zone.

    - **Officer** — works a single assigned zone. Reviews evidence, moves
      complaints through the lifecycle, posts progress notes. Never sees who
      filed a complaint, and never sees other zones or admins.

    - **Admin** — full access across all zones. Manages accounts and SLAs,
      views analytics, exports data, triggers AI zone reports. Invisible to
      everyone else.


    ## Authentication


    All endpoints require a JWT in the `Authorization: Bearer <token>` header,
    **except** the few marked as public (registration, login, and the reference
    lists needed to fill the registration form).

  contact:
    name: Kartavya Backend Team
    url: https://github.com/

servers:
  - url: /api/v1
    description: >
      Version 1 of the Kartavya API. Note: the URL segment `v1` is the API's
      major version (unchanged, since nothing is deployed yet), while
      `info.version` (2.0.0) is the revision number of this contract document.
      A breaking change to the API would introduce `/api/v2`.

tags:
  - name: Authentication
    description: Account creation and login. These are the only endpoints a user can reach without a token.
  - name: Reference
    description: Fixed lookup data (the 12 categories and the list of zones). Public so the registration form can use them.
  - name: Complaints
    description: Creating, viewing, and acting on individual complaints (citizen-facing actions).
  - name: Feed
    description: The anonymized public complaint feed for a citizen's zone.
  - name: Officer
    description: Zone-scoped actions for officers — queue, evidence review, status changes, progress notes, zone analytics.
  - name: Admin
    description: Cross-zone management — users, SLAs, analytics, AI reports, CSV export, overrides, settings.
  - name: Gamification
    description: Citizen points, badges, and leaderboards.
  - name: AI
    description: AI helper endpoints that assist users but never make the final decision.
  - name: Officers (Public)
    description: The small, citizen-safe view of an officer's public statistics.

# Every endpoint requires a JWT by default. Public endpoints override this with `security: []`.
security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------------------
  # AUTHENTICATION
  # ---------------------------------------------------------------------------

  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerCitizen
      summary: Register a new citizen
      description: >
        Creates a **citizen** account. This is the only self-service signup in
        the system. Officers and admins are never created here — officers are
        created by an admin, and admins are seeded directly into the database.


        The citizen must pick the zone they live in or report from. Use
        `GET /zones` (which is public) to populate that dropdown.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Citizen account created. A token is returned so the user is logged in immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Log in (any role)
      description: >
        Authenticates a citizen, officer, or admin by email and password and
        returns a JWT plus the basic profile needed to route them to the right
        dashboard. Deactivated accounts are rejected here with a 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email/password, or the account is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # REFERENCE DATA (public)
  # ---------------------------------------------------------------------------

  /categories:
    get:
      tags: [Reference]
      operationId: getCategories
      summary: Get the 12 fixed complaint categories
      description: >
        Returns the fixed list of 12 civic categories, each with its current
        SLA target time in hours. The category list itself cannot be changed
        from inside the app. The SLA target *can* be changed by an admin via
        `PATCH /admin/slas/{categoryId}`, and this endpoint always reflects the
        current value — so it doubles as the "read SLA targets" endpoint.
      security: []
      responses:
        '200':
          description: The category list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /zones:
    get:
      tags: [Reference]
      operationId: getZones
      summary: Get all zones
      description: >
        Returns every zone (admin-created areas, e.g. "Ward 12 – North"). This
        is **public** because the registration form needs it before the user
        has a token.
      security: []
      responses:
        '200':
          description: The list of zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'

  /zones/suggest:
    post:
      tags: [Reference]
      operationId: suggestZone
      summary: Suggest the nearest zone for a location
      description: >
        Given a latitude/longitude (typically read from a photo's EXIF GPS),
        returns the single nearest zone by centre distance. The complaint form
        uses this to **pre-fill** the zone picker so the citizen usually just
        confirms instead of scrolling. It is advisory only — the citizen can
        always change the pick, and the server never routes on this alone.
        Because it matches the *nearest* centre, it always returns one zone
        (there are no gaps or overlaps to fall into).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneSuggestionRequest'
      responses:
        '200':
          description: The nearest zone (or null if none could be determined).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneSuggestionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # COMPLAINTS (citizen-facing)
  # ---------------------------------------------------------------------------

  /complaints:
    post:
      tags: [Complaints]
      operationId: createComplaint
      summary: File a new complaint
      description: >
        A citizen files a complaint by choosing one of the 12 categories,
        uploading a single photo (JPEG or PNG, max 5 MB), and sharing a location
        (latitude/longitude).


        On submission the server automatically:

        - assigns the complaint to the zone the location falls into,

        - sets the status to `SUBMITTED`,

        - kicks off AI photo pre-screening in the background (non-blocking — the
          confidence note is attached to the evidence record when it is ready),

        - checks for nearby open complaints of the same category (Haversine,
          ~50–100 m) and links them into a cluster, recomputing severity.


        None of those steps block the response. If the AI model is down, the
        complaint is still created normally.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201':
          description: Complaint created and routed to a zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: Missing field, wrong file type/size, a location that maps to no zone, or an explicitly-submitted zoneId that is deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only citizens can file complaints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /complaints/my:
    get:
      tags: [Complaints]
      operationId: getMyComplaints
      summary: Get my complaints (citizen dashboard)
      description: >
        Returns every complaint filed by the logged-in citizen, newest first,
        for their personal dashboard. Each item carries its current status,
        category, severity and SLA labels, and a flag telling the frontend when
        the citizen needs to act (for example, "officer asked for more evidence"
        or "please confirm the fix").
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          description: Optional filter by one or more statuses.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComplaintStatus'
        - name: categoryId
          in: query
          description: Optional filter by category.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The citizen's complaints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /complaints/{complaintId}:
    get:
      tags: [Complaints]
      operationId: getComplaintById
      summary: Get one complaint in full
      description: >
        Returns the full detail of a single complaint: description, photo,
        location, evidence (including the AI confidence note and the officer's
        verdict), the complete status history, and all progress notes.


        The response is shaped by role:

        - **Citizen** — only if it is their own complaint (otherwise 403).

        - **Officer** — only if the complaint is in their zone; the reporter's
          identity is stripped out.

        - **Admin** — any complaint, with full detail including the reporter.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: The complaint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /complaints/{complaintId}/evidence:
    post:
      tags: [Complaints]
      operationId: submitAdditionalEvidence
      summary: Submit additional evidence (when asked)
      description: >
        Lets the citizen upload a new, clearer photo **only when** their
        complaint is in the `NEEDS_MORE_EVIDENCE` stage. After upload, the
        complaint moves back to `EVIDENCE_UNDER_REVIEW` for the officer to look
        again. The old photo is kept as well — both are retained in the evidence
        history. AI re-screening runs again in the background on the new photo.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitEvidenceRequest'
      responses:
        '201':
          description: New evidence accepted; complaint returned to evidence review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: Wrong file type or size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The complaint is not in the NEEDS_MORE_EVIDENCE stage, so extra evidence cannot be added right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /complaints/{complaintId}/upvote:
    post:
      tags: [Complaints]
      operationId: upvoteComplaint
      summary: Upvote someone else's complaint
      description: >
        A citizen upvotes a complaint in their zone that is **not their own** and
        **not yet closed**. Each citizen can upvote a given complaint only once.


        An upvote raises the complaint's severity score (and may bump its
        severity label), and credits +5 CSP to the citizen who originally filed
        it.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Upvote recorded. Returns the new upvote count and severity label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpvoteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: You cannot upvote your own complaint, or a complaint outside your zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: You have already upvoted this complaint, or it is already closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /complaints/{complaintId}/confirm:
    post:
      tags: [Complaints]
      operationId: confirmResolution
      summary: Confirm the fix (close the complaint)
      description: >
        The citizen confirms that an issue marked `RESOLVED` by the officer is
        genuinely fixed. The complaint then moves to `CLOSED`, and the system
        automatically credits points and checks for any newly earned badges.


        **Points:** if this complaint is standalone (no `clusterId`), or it is
        the first complaint in its cluster to be confirmed, the citizen gets
        the full `COMPLAINT_CLOSED` bonus (+50). If another member of the same
        cluster already won that reward, this citizen instead gets a smaller
        `CLUSTER_MEMBER_CLOSED` consolation (+10) — the +50 is paid once per
        cluster, not once per member. Either way, the `ON_TIME_BONUS` (+15) is
        evaluated independently against **this complaint's own** SLA snapshot,
        regardless of which reward it received.


        A complaint can only reach `CLOSED` through this confirmation (or the
        admin-configured auto-close timeout). An officer marking it Resolved is
        never enough on its own.


        **Repeat calls:** this action is only valid while the complaint is in the
        `RESOLVED` stage. Calling it again after the complaint is already
        `CLOSED` returns `409` (it is no longer awaiting confirmation), so the
        action is safe against accidental double-submits.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: Complaint closed; points and badges updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The complaint is not in the RESOLVED stage, so it cannot be confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /complaints/{complaintId}/dispute:
    post:
      tags: [Complaints]
      operationId: disputeResolution
      summary: Dispute the fix (reopen the complaint)
      description: >
        The citizen says a `RESOLVED` complaint is not actually fixed. A reason
        is **required**. The complaint moves to `REOPENED` and goes back to the
        officer's queue with the citizen's reason attached. No points are
        credited.


        **Repeat calls:** valid only while the complaint is in the `RESOLVED`
        stage. Once it has moved to `REOPENED`, a second dispute returns `409`,
        protecting against accidental double-submits.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
      responses:
        '200':
          description: Complaint reopened and returned to the officer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: Missing reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The complaint is not in the RESOLVED stage, so it cannot be disputed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # PUBLIC FEED (citizen)
  # ---------------------------------------------------------------------------

  /feed:
    get:
      tags: [Feed]
      operationId: getPublicFeed
      summary: Browse the public complaint feed
      description: >
        The "Instagram Explore"-style feed for citizens. Shows complaints in the
        citizen's own zone with photo, category, severity label, upvote count,
        and status — but **never** who filed them. By default it shows active
        complaints; closed and rejected ones are hidden unless explicitly
        requested, in which case they are clearly marked.


        Citizens can upvote straight from this feed (subject to the
        one-upvote-per-complaint rule).
      parameters:
        - name: zoneId
          in: query
          description: Defaults to the caller's own zone. Citizens may only request their own zone.
          required: false
          schema:
            type: string
        - name: includeResolved
          in: query
          description: Set to true to also include closed/rejected complaints (clearly marked).
          required: false
          schema:
            type: boolean
            default: false
        - name: categoryId
          in: query
          description: Optional filter by category.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Anonymized feed for the zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only citizens can browse the feed, or a citizen requested a zone that is not theirs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # OFFICER
  # ---------------------------------------------------------------------------

  /officer/complaints:
    get:
      tags: [Officer]
      operationId: getOfficerQueue
      summary: Get my zone's complaint queue
      description: >
        Returns only the complaints in the officer's assigned zone, with the
        reporter's identity removed. By default they are sorted with the most
        urgent first (Critical severity and Overdue SLA at the top). Optional
        filters help the officer focus.


        An officer can never see another zone's complaints through this or any
        other endpoint.
      parameters:
        - name: status
          in: query
          description: Filter by one or more statuses.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComplaintStatus'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SlaLabel'
        - name: severityLabel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SeverityLabel'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The officer's zone queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /officer/complaints/{complaintId}/evidence-review:
    post:
      tags: [Officer]
      operationId: reviewEvidence
      summary: Review the photo and give a verdict
      description: >
        The officer judges the submitted photo and picks exactly one verdict:


        - `VALID` — accepted. The complaint advances to `UNDER_REVIEW` and the
          SLA timer starts.

        - `NEEDS_MORE_EVIDENCE` — the citizen is asked for a better photo.
          A reason is **required**.

        - `REJECTED` — turned down as fake or invalid. The complaint is closed
          as rejected, a reason is **required**, and the citizen loses 20 CSP.


        The verdict and reason are stored on the evidence record and become part
        of the permanent history. The AI confidence note (if any) is advisory
        only — the officer's verdict always wins.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceReviewRequest'
      responses:
        '200':
          description: Verdict recorded and the complaint moved accordingly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: A reason is required for NEEDS_MORE_EVIDENCE and REJECTED but was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The complaint is not at the evidence-review stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /officer/complaints/{complaintId}/status:
    patch:
      tags: [Officer]
      operationId: updateComplaintStatus
      summary: Move one complaint to the next stage
      description: >
        Moves a single complaint along the lifecycle. The server only allows
        legal transitions (see the `ComplaintStatus` schema for the full map).
        Examples an officer uses here:


        - `UNDER_REVIEW` → `IN_PROGRESS`

        - `IN_PROGRESS` → `UNDER_RESOLUTION`

        - `UNDER_RESOLUTION` → `RESOLVED` (optionally with a closing note)

        - `REOPENED` → `IN_PROGRESS` (the officer picks a disputed complaint
          back up from their queue)

        - any active stage → `UNRESOLVABLE` (**reason required**)


        Marking `RESOLVED` does **not** close the complaint — the citizen must
        still confirm. An illegal jump (e.g. `SUBMITTED` → `RESOLVED`) is
        rejected with 409.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Status updated; a new history entry was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          description: A reason is required for UNRESOLVABLE but was missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That status change is not allowed from the current stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /officer/complaints/batch-status:
    post:
      tags: [Officer]
      operationId: batchUpdateStatus
      summary: Move several complaints at once
      description: >
        Lets an officer move many complaints to the same status in one action —
        for example, sending a whole street of pothole reports to
        `UNDER_RESOLUTION` together after monsoon damage.


        The same rules as `PATCH /officer/complaints/{complaintId}/status`
        apply to every item: only legal, officer-triggerable transitions are
        allowed (`IN_PROGRESS`, `UNDER_RESOLUTION`, `RESOLVED`, `REOPENED` →
        `IN_PROGRESS`, or any active stage → `UNRESOLVABLE` with a reason).
        Targets reserved for other actors — `CLOSED` (citizen confirmation
        only), `REJECTED`/`UNDER_REVIEW` (evidence-review only) — are rejected
        per-item, the same as an illegal single-item transition. `RESOLVED` is
        allowed in a batch, but unlike the single-item endpoint there is no way
        to attach a per-complaint closing `note` — officers who need one should
        resolve that complaint individually instead.


        Each complaint is validated and recorded individually (its own history
        entry and timestamp). The response reports success or failure
        per-complaint, so a single bad one does not silently fail the rest. The
        frontend should show a confirmation prompt before calling this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchStatusUpdateRequest'
      responses:
        '200':
          description: Batch processed. Check each item's result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /officer/complaints/{complaintId}/notes:
    post:
      tags: [Officer]
      operationId: addProgressNote
      summary: Post a progress note the citizen can see
      description: >
        The officer adds a short note (up to 500 characters) to a complaint that
        is `IN_PROGRESS` or `UNDER_RESOLUTION`. The note appears on the citizen's
        complaint page with the officer's ID (not name) and a timestamp. Notes
        are permanent — they cannot be edited or deleted, since they form an
        audit trail.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressNoteRequest'
      responses:
        '201':
          description: Note added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressNote'
        '400':
          description: Empty note or over 500 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Notes can only be added in the IN_PROGRESS or UNDER_RESOLUTION stages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /officer/analytics:
    get:
      tags: [Officer]
      operationId: getOfficerAnalytics
      summary: Get analytics for my zone
      description: >
        Live analytics for the officer's own zone only: active complaints,
        overdue count, average resolution time this month, and a breakdown by
        category. The officer cannot see other zones or admin-level metrics.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Zone analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # OFFICER (public stats for citizens)
  # ---------------------------------------------------------------------------

  /officers/{officerId}/stats:
    get:
      tags: [Officers (Public)]
      operationId: getPublicOfficerStats
      summary: Get an officer's public stats
      description: >
        A small, citizen-safe view of an officer — only their public ID and the
        total number of complaints they have resolved (like a delivery app
        rating). No personal details, no performance breakdown.
      parameters:
        - $ref: '#/components/parameters/OfficerId'
      responses:
        '200':
          description: Public officer stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOfficerStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # ADMIN — complaints
  # ---------------------------------------------------------------------------

  /admin/complaints:
    get:
      tags: [Admin]
      operationId: getAllComplaints
      summary: Get complaints across all zones
      description: >
        Admin view of every complaint, with full detail including reporter
        identity. Supports the same filters used for the dashboard and CSV
        export.
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComplaintStatus'
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SlaLabel'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Filtered complaints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/complaints/{complaintId}:
    patch:
      tags: [Admin]
      operationId: overrideComplaint
      summary: Override a complaint
      description: >
        Administrative override of a complaint — for example, correcting the
        category, forcing a status, or manually reassigning it to a different
        zone (useful for the "Unassigned" catch-all). Every override is recorded
        in the status history with the admin as the actor.


        **SLA backfill:** forcing `status` to `UNDER_REVIEW` or any later stage
        skips the normal evidence-review path that would otherwise start the
        SLA timer. If the internal SLA-start timestamp is still unset when the
        override lands the complaint at `UNDER_REVIEW` or beyond, the server
        backfills it to now and snapshots `slaTargetHours` from the category's
        current SLA — the same values the evidence-review `VALID` verdict
        would have set — so `slaLabel` stays meaningful immediately after the
        override.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintOverrideRequest'
      responses:
        '200':
          description: Complaint updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # ADMIN — users
  # ---------------------------------------------------------------------------

  /admin/users:
    get:
      tags: [Admin]
      operationId: getAllUsers
      summary: List users
      description: List all accounts. Filterable by role and zone.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Role'
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a citizen or officer account
      description: >
        Creates a citizen or officer account. For an officer, exactly one
        `zoneId` is required — that is how officers are assigned to a zone at
        creation time. Admins cannot be created through the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/{userId}:
    get:
      tags: [Admin]
      operationId: getUserById
      summary: Get one user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Update or deactivate a user
      description: >
        Edits a user's details, reassigns an officer to a new zone, or
        activates/deactivates an account via the `active` flag. **Deactivating**
        (rather than deleting) is the recommended way to disable an account: a
        deactivated user cannot log in, but all their complaints, points, and
        history stay intact for the audit trail. Reassigning an officer's zone
        takes effect immediately: they instantly lose access to the old
        zone's complaints, and every non-terminal complaint still assigned to
        them there has `assignedOfficerId` cleared back to `null` — those
        complaints become unassigned and available to whichever officer now
        covers that zone, rather than staying stuck with someone who can no
        longer see them.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The new email is already taken by another account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Permanently delete a user (use with care)
      description: >
        Hard-deletes an account. **Prefer deactivation** (`PATCH` with
        `active: false`) instead — deleting a user who already has complaints,
        points, evidence reviews, progress notes, or status changes on record
        will be refused. This endpoint is intended only for truly empty/test
        accounts.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted (no content).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This account has linked records and cannot be hard-deleted. Deactivate it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # ADMIN — zones, SLAs, settings
  # ---------------------------------------------------------------------------

  /admin/zones:
    post:
      tags: [Admin]
      operationId: createZone
      summary: Create a zone
      description: >
        Creates a new admin-managed zone with a stable code, a display name, and
        a centre point. The centre is what nearest-zone matching uses. The code
        is permanent once set; only the name can be changed later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneRequest'
      responses:
        '201':
          description: Zone created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A zone with this code already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/zones/{zoneId}:
    patch:
      tags: [Admin]
      operationId: updateZone
      summary: Rename or deactivate a zone
      description: >
        Updates a zone's display name, or deactivates/reactivates it via the
        `isActive` flag. **The zone code cannot be changed** — it is a stable
        identifier used across the system. Deactivating is the safe alternative
        to deletion: the zone stops accepting new complaints but keeps all its
        history. Moving a zone's centre is deliberately not offered here, because
        existing complaints keep their originally assigned zone regardless.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateZoneRequest'
      responses:
        '200':
          description: Zone updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteZone
      summary: Delete a zone (only if unused)
      description: >
        Permanently deletes a zone. Allowed **only** if nothing references it —
        no complaints, no assigned officers, and no citizens whose home zone
        is this one (registration requires a home zone, so in practice any
        zone that has ever had a citizen sign up against it is blocked too,
        not just zones with complaints or officers). If anything does, the
        delete is refused with `409`, and the admin should deactivate the
        zone instead. The catch-all "Unassigned" zone can never be deleted.
        This endpoint exists mainly to clean up zones created by mistake,
        before real citizens have registered against them.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '204':
          description: Zone deleted (no content).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The zone has complaints, assigned officers, or citizens whose home zone is this one (or it is the catch-all) and cannot be deleted. Deactivate it instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/zones/{zoneId}/assign-officer:
    post:
      tags: [Admin]
      operationId: assignOfficerToZone
      summary: Assign an officer to a zone
      description: >
        Assigns (or reassigns) an existing officer to this zone. The change is
        immediate: the officer instantly loses access to the old zone's
        complaints and gains access to this zone's. If this is a reassignment,
        every non-terminal complaint still assigned to them in the old zone
        has `assignedOfficerId` cleared back to `null`, the same as
        `PATCH /admin/users/{userId}`.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOfficerRequest'
      responses:
        '200':
          description: Officer assigned to the zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The user is not an officer, or the officer/zone does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/slas/{categoryId}:
    patch:
      tags: [Admin]
      operationId: updateSla
      summary: Set a category's SLA target time
      description: >
        Updates the target resolution time (in hours) for one category. The new
        value applies to complaints accepted **after** the change; complaints
        already in progress keep the target they started with. Minimum 1 hour.
        To read current targets, use `GET /categories`.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlaUpdateRequest'
      responses:
        '200':
          description: SLA target updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Target below the 1-hour minimum, or zero/negative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Get system settings
      description: Returns adjustable system-wide settings, such as the auto-close timeout.
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: updateSettings
      summary: Update system settings
      description: >
        Updates system-wide settings. The main one here is
        `autoCloseTimeoutHours` — how long a `RESOLVED` complaint waits for the
        citizen to respond before it auto-closes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # ADMIN — analytics, officer performance, AI report, export
  # ---------------------------------------------------------------------------

  /admin/analytics:
    get:
      tags: [Admin]
      operationId: getSystemAnalytics
      summary: Get all-zone analytics
      description: >
        Live, cross-zone dashboard data: per-zone pending/overdue/resolved
        counts and average resolution time, which zones have the most overdue
        complaints, the top 3 citizens by points in each zone, and a
        severity heatmap grid. Always reflects the current database state.
      responses:
        '200':
          description: System analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/officers/{officerId}/performance:
    get:
      tags: [Admin]
      operationId: getOfficerPerformance
      summary: Monitor one officer's performance
      description: >
        A per-officer scorecard: total handled, on-time/delayed/overdue
        resolutions, and the evidence accept/reject breakdown. Complaints marked
        `UNRESOLVABLE` are excluded from the on-time/overdue figures so officers
        are not penalised for things outside their control. Filterable by time
        period.
      parameters:
        - $ref: '#/components/parameters/OfficerId'
        - name: period
          in: query
          description: Convenience window for the stats.
          required: false
          schema:
            type: string
            enum: [this_month, last_month, all_time]
            default: this_month
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Officer performance summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerPerformance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/zones/{zoneId}/ai-report:
    post:
      tags: [Admin]
      operationId: generateAiZoneReport
      summary: Generate an AI zone health report
      description: >
        Kicks off generation of a plain-English civic-health summary for a zone,
        built from its live numbers. Generation is **asynchronous and
        non-blocking** — the admin can keep using the dashboard. This call
        returns straight away with a `reportId` and a `PENDING` status; poll the
        matching `GET` to fetch the finished report.


        If the AI model is unavailable, the report comes back with status
        `FAILED` and `aiAvailable: false`, and the rest of the dashboard keeps
        working.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '202':
          description: Report generation started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiZoneReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Admin]
      operationId: getAiZoneReport
      summary: Get the latest AI zone report
      description: >
        Returns the most recently generated report for the zone (stored, so it
        can be viewed again without regenerating). While a report is still being
        produced, its status is `PENDING`; once ready it is `READY` with the full
        text.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200':
          description: The stored report (may still be PENDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiZoneReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No report has ever been generated for this zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/export/complaints:
    get:
      tags: [Admin]
      operationId: exportComplaintsCsv
      summary: Export complaints as CSV
      description: >
        Downloads the filtered complaint set as a CSV file. Columns: ID,
        category, zone, status, severity, timestamps, SLA label, and officer ID.
        Citizen personal details are deliberately excluded. Works for both small
        and large (1,000+) result sets.
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComplaintStatus'
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SlaLabel'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: A CSV file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # GAMIFICATION
  # ---------------------------------------------------------------------------

  /gamification/points:
    get:
      tags: [Gamification]
      operationId: getMyPoints
      summary: Get my points
      description: >
        Returns the citizen's total lifetime CSP and this month's CSP, plus a
        paged ledger of every points change (so the total is always auditable
        and never a single editable number).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Points summary and ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gamification/badges:
    get:
      tags: [Gamification]
      operationId: getMyBadges
      summary: Get my badges
      description: Returns the badges the citizen has earned, each with the date earned.
      responses:
        '200':
          description: Earned badges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Badge'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /leaderboard:
    get:
      tags: [Gamification]
      operationId: getLeaderboard
      summary: Get the leaderboard
      description: >
        Returns ranked citizens for either the **zone** or the **city** scope.
        Monthly rankings reset at the start of each month; lifetime totals never
        reset. The response also includes the caller's own rank, so the
        dashboard can show "you are #7" even if they are not in the visible top
        slice. The top 3 are flagged for highlighting.
      parameters:
        - name: scope
          in: query
          required: true
          description: Rank within the caller's zone, or across the whole city.
          schema:
            type: string
            enum: [zone, city]
        - name: period
          in: query
          required: false
          description: Current month's ranking (default) or all-time.
          schema:
            type: string
            enum: [monthly, all_time]
            default: monthly
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Leaderboard rankings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          description: Missing or invalid scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # AI
  # ---------------------------------------------------------------------------

  /ai/suggest-category:
    post:
      tags: [AI]
      operationId: suggestCategory
      summary: Suggest a category from a description
      description: >
        Used by the complaint form **while the citizen is typing**, before any
        complaint exists. Send the description text (in any language) and get
        back the AI's best-guess category as a non-blocking hint. The citizen is
        free to accept it or pick a different category — the suggestion is never
        binding.


        This degrades gracefully: if the local AI model is unavailable, the
        response returns `aiAvailable: false` with no suggestion, and the form
        keeps working normally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorySuggestionRequest'
      responses:
        '200':
          description: A suggestion (or a clean "unavailable" response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuggestionResponse'
        '400':
          description: Empty description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Send the JWT from login as `Authorization: Bearer <token>`."

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number for paged lists.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: >
        Optional sort order. Use a field name, prefixed with `-` for descending.
        Supported fields on complaint lists: `createdAt`, `updatedAt`,
        `severity`, `sla`, `upvotes`. Example: `-createdAt` (newest first).
        If omitted, each endpoint uses its documented default order.
      required: false
      schema:
        type: string
        example: -createdAt
    DateFrom:
      name: dateFrom
      in: query
      description: Include records on or after this date/time (ISO 8601).
      required: false
      schema:
        type: string
        format: date-time
    DateTo:
      name: dateTo
      in: query
      description: Include records on or before this date/time (ISO 8601).
      required: false
      schema:
        type: string
        format: date-time
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    OfficerId:
      name: officerId
      in: path
      required: true
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: The request was malformed or a required field was missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid token was provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: You are authenticated but not allowed to do this (wrong role or wrong zone).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # ---- Shared enums ----

    Role:
      type: string
      description: The kind of account. SYSTEM is never a valid account role — see StatusActor for automated status changes.
      enum: [CITIZEN, OFFICER, ADMIN]

    StatusActor:
      type: string
      description: >
        Who or what caused a status_history entry. Distinct from Role because
        SYSTEM changes exist — e.g. auto-closing a RESOLVED complaint after
        the configured timeout, or cascading all members of a cluster to
        RESOLVED together when the officer resolves the shared issue.
      enum: [CITIZEN, OFFICER, ADMIN, SYSTEM]

    ComplaintStatus:
      type: string
      description: >
        The stage a complaint is in. The server enforces these transitions:


        - `SUBMITTED` → `EVIDENCE_UNDER_REVIEW`

        - `EVIDENCE_UNDER_REVIEW` → `UNDER_REVIEW` (Valid) | `NEEDS_MORE_EVIDENCE` | `REJECTED`

        - `NEEDS_MORE_EVIDENCE` → `EVIDENCE_UNDER_REVIEW` (citizen re-uploads)

        - `UNDER_REVIEW` → `IN_PROGRESS`

        - `IN_PROGRESS` → `UNDER_RESOLUTION`

        - `UNDER_RESOLUTION` → `RESOLVED`

        - `RESOLVED` → `CLOSED` (citizen confirms) | `REOPENED` (citizen disputes)

        - `REOPENED` → `IN_PROGRESS`

        - any active stage (`UNDER_REVIEW`, `IN_PROGRESS`, `UNDER_RESOLUTION`) → `UNRESOLVABLE`


        `REJECTED`, `CLOSED`, and `UNRESOLVABLE` are terminal.
      enum:
        - SUBMITTED
        - EVIDENCE_UNDER_REVIEW
        - NEEDS_MORE_EVIDENCE
        - REJECTED
        - UNDER_REVIEW
        - IN_PROGRESS
        - UNDER_RESOLUTION
        - RESOLVED
        - CLOSED
        - REOPENED
        - UNRESOLVABLE

    SeverityLabel:
      type: string
      description: Auto-calculated from nearby reports and upvotes. Officers can see it but not change it.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    SlaLabel:
      type: string
      description: On Time (<80% of target), Delayed (80–100%), Overdue (>100%).
      enum: [ON_TIME, DELAYED, OVERDUE]

    EvidenceVerdict:
      type: string
      enum: [VALID, NEEDS_MORE_EVIDENCE, REJECTED]

    # ---- Error ----

    Error:
      type: object
      description: A consistent error shape used everywhere.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A short machine-readable code, e.g. "VALIDATION_ERROR", "INVALID_TRANSITION".
              example: VALIDATION_ERROR
            message:
              type: string
              description: A human-friendly explanation.
              example: A reason is required when rejecting a complaint.
            details:
              type: array
              description: Optional per-field problems.
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: reason
                  issue:
                    type: string
                    example: must not be empty
          required: [code, message]
      required: [error]

    # ---- Pagination ----

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 137
        totalPages:
          type: integer
          example: 7
      required: [page, pageSize, totalItems, totalPages]

    # ---- Auth ----

    RegisterRequest:
      type: object
      required: [name, email, password, zoneId]
      properties:
        name:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
          example: asha@example.com
        password:
          type: string
          format: password
          minLength: 8
        zoneId:
          type: string
          description: The zone the citizen lives in or reports from.
          example: zone_012

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: The JWT to send on later requests.
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'
      required: [token, tokenType, user]

    # ---- User ----

    User:
      type: object
      description: An account. Password is never returned.
      properties:
        id:
          type: string
          example: user_1001
        role:
          $ref: '#/components/schemas/Role'
        name:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
        zoneId:
          type: string
          nullable: true
          description: The officer's assigned zone, or the citizen's home zone. Null for admins.
        active:
          type: boolean
          description: Deactivated accounts cannot log in.
          example: true
        createdAt:
          type: string
          format: date-time
      required: [id, role, name, active]

    CreateUserRequest:
      type: object
      required: [role, name, email, password]
      properties:
        role:
          type: string
          enum: [CITIZEN, OFFICER]
          description: Admins cannot be created here.
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        zoneId:
          type: string
          description: Required when role is OFFICER (exactly one zone). Optional/home-zone for CITIZEN.

    UpdateUserRequest:
      type: object
      description: All fields optional — send only what changes.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        zoneId:
          type: string
          description: Reassign an officer to a new zone (takes effect immediately).
        active:
          type: boolean
          description: Set false to deactivate (recommended over deletion), true to reactivate.

    AssignOfficerRequest:
      type: object
      required: [officerId]
      properties:
        officerId:
          type: string

    # ---- Reference ----

    Category:
      type: object
      properties:
        id:
          type: string
          example: cat_pothole
        name:
          type: string
          example: Pothole
        description:
          type: string
          example: A hole in the road surface that can damage vehicles or injure people.
        slaTargetHours:
          type: integer
          description: Current target resolution time in hours.
          example: 72
      required: [id, name, slaTargetHours]

    Zone:
      type: object
      properties:
        id:
          type: string
          example: zone_012
        code:
          type: string
          description: Stable identifier, fixed once the zone is created (a rename never changes it).
          example: WARD-12-N
        name:
          type: string
          example: Ward 12 – North
        isCatchAll:
          type: boolean
          description: True for the single "Unassigned" fallback zone.
          default: false
        isActive:
          type: boolean
          description: Deactivated zones are hidden from new complaint filing but keep their history.
          default: true
      required: [id, name]

    CreateZoneRequest:
      type: object
      required: [code, name, centerLat, centerLng]
      properties:
        code:
          type: string
          description: Stable identifier. Cannot be changed later.
          example: WARD-12-N
        name:
          type: string
          example: Ward 12 – North
        centerLat:
          type: number
          format: double
          description: >
            Zone centre. Routing uses nearest-centroid — a location belongs to
            whichever zone's centre it is closest to, so every coordinate maps
            to exactly one zone with no gaps or overlaps.
        centerLng:
          type: number
          format: double

    UpdateZoneRequest:
      type: object
      description: All fields optional. The zone code cannot be changed here.
      properties:
        name:
          type: string
          description: Rename the zone (display name only).
        isActive:
          type: boolean
          description: Set false to deactivate the zone instead of deleting it.

    ZoneSuggestionRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946

    ZoneSuggestionResponse:
      type: object
      description: The nearest zone to a location, used to pre-fill the complaint form's zone picker. Advisory only.
      properties:
        suggestedZone:
          allOf:
            - $ref: '#/components/schemas/Zone'
          nullable: true
          description: The closest zone by centre distance, or null if none could be determined.
      required: [suggestedZone]

    # ---- Complaint ----

    CreateComplaintRequest:
      type: object
      required: [categoryId, photo, latitude, longitude]
      properties:
        categoryId:
          type: string
          description: One of the 12 categories (may be AI-suggested or manually chosen).
          example: cat_pothole
        description:
          type: string
          description: Free-text description of the issue.
        photo:
          type: string
          format: binary
          description: JPEG or PNG, max 5 MB.
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946
        zoneId:
          type: string
          description: >
            The zone the citizen confirmed for this complaint. The client
            pre-selects it (from photo EXIF GPS via /zones/suggest, or the
            citizen's manual choice) and the citizen confirms it. The server
            trusts this value rather than silently re-deriving it, **except**
            it still checks the zone is active — a `zoneId` for a deactivated
            zone is rejected with `400` rather than silently accepted or
            rerouted, since the client's cached zone list may be stale. If
            omitted, the server falls back to the nearest *active* zone, and
            if none is close enough, to the catch-all "Unassigned" zone.
          example: zone_012
        categorySuggestedByAi:
          type: boolean
          description: Whether the chosen category came from the AI suggestion (for analytics).
          default: false

    Complaint:
      type: object
      description: A compact complaint, used in lists and queues.
      properties:
        id:
          type: string
          example: cmp_5001
        category:
          $ref: '#/components/schemas/Category'
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        severityLabel:
          $ref: '#/components/schemas/SeverityLabel'
        slaLabel:
          $ref: '#/components/schemas/SlaLabel'
        upvoteCount:
          type: integer
          example: 14
        photoUrl:
          type: string
          format: uri
        zoneId:
          type: string
        zoneName:
          type: string
        assignedOfficerId:
          type: string
          nullable: true
          description: The officer's public ID (never their name).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        citizenActionNeeded:
          type: string
          nullable: true
          description: A hint for the citizen dashboard, e.g. "CONFIRM_FIX" or "PROVIDE_MORE_EVIDENCE".
          enum: [CONFIRM_FIX, PROVIDE_MORE_EVIDENCE, null]
      required: [id, category, status, createdAt]

    ComplaintDetail:
      allOf:
        - $ref: '#/components/schemas/Complaint'
        - type: object
          properties:
            description:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            severityScore:
              type: integer
              description: The raw score behind the label = (nearby similar reports × 3) + (upvotes × 1).
              example: 17
            slaTargetHours:
              type: integer
              nullable: true
              description: Set once the complaint is accepted (UNDER_REVIEW); null before that.
            clusterId:
              type: string
              nullable: true
              description: Set if this complaint is linked to nearby duplicates.
            reporter:
              allOf:
                - $ref: '#/components/schemas/User'
              nullable: true
              description: Only present for admins. Always omitted from officer and feed views.
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/Evidence'
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            progressNotes:
              type: array
              items:
                $ref: '#/components/schemas/ProgressNote'

    ComplaintListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Complaint'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    FeedItem:
      type: object
      description: A feed entry — never includes who filed it.
      properties:
        id:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        severityLabel:
          $ref: '#/components/schemas/SeverityLabel'
        upvoteCount:
          type: integer
        hasUpvoted:
          type: boolean
          description: Whether the calling citizen has already upvoted this one.
        photoUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
      required: [id, category, status, upvoteCount, hasUpvoted]

    FeedListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeedItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, pagination]

    # ---- Evidence / history / notes ----

    Evidence:
      type: object
      properties:
        id:
          type: string
        photoUrl:
          type: string
          format: uri
        sequence:
          type: integer
          description: 1 for the original photo, 2+ for re-submissions.
          example: 1
        aiConfidenceNote:
          $ref: '#/components/schemas/AiConfidenceNote'
        verdict:
          allOf:
            - $ref: '#/components/schemas/EvidenceVerdict'
          nullable: true
          description: Null until the officer reviews it.
        verdictReason:
          type: string
          nullable: true
          description: Required for NEEDS_MORE_EVIDENCE and REJECTED.
        reviewedByOfficerId:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required: [id, photoUrl, sequence, submittedAt]

    AiConfidenceNote:
      type: object
      description: The AI photo pre-screening result. Advisory only — the officer decides.
      properties:
        aiAvailable:
          type: boolean
          description: False if the AI model was down when the photo was submitted.
          example: true
        matchesCategory:
          type: boolean
          nullable: true
          description: Whether the photo appears to match the chosen category.
        confidence:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          example: 0.82
        note:
          type: string
          nullable: true
          example: Photo appears to show a pothole, consistent with the selected category.
      required: [aiAvailable]

    StatusHistoryEntry:
      type: object
      description: One recorded stage change — the full audit trail.
      properties:
        id:
          type: string
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/ComplaintStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/ComplaintStatus'
        changedByRole:
          $ref: '#/components/schemas/StatusActor'
        changedByOfficerId:
          type: string
          nullable: true
          description: Officer's public ID when an officer made the change.
        reason:
          type: string
          nullable: true
          description: Present for things like REJECTED, UNRESOLVABLE, or a dispute.
        remark:
          type: string
          nullable: true
          description: >
            Optional free-text remark distinct from reason — for example the
            officer's closing note (StatusUpdateRequest.note) when marking
            RESOLVED.
        timestamp:
          type: string
          format: date-time
      required: [id, toStatus, changedByRole, timestamp]

    ProgressNote:
      type: object
      properties:
        id:
          type: string
        officerId:
          type: string
          description: The officer's public ID (not name).
        text:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
      required: [id, officerId, text, createdAt]

    # ---- Request bodies for actions ----

    SubmitEvidenceRequest:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPEG or PNG, max 5 MB.

    EvidenceReviewRequest:
      type: object
      required: [verdict]
      properties:
        verdict:
          $ref: '#/components/schemas/EvidenceVerdict'
        reason:
          type: string
          description: Required when verdict is NEEDS_MORE_EVIDENCE or REJECTED.

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        reason:
          type: string
          description: Required when moving to UNRESOLVABLE.
        note:
          type: string
          description: Optional closing note when marking RESOLVED.

    BatchStatusUpdateRequest:
      type: object
      required: [complaintIds, status]
      properties:
        complaintIds:
          type: array
          minItems: 1
          items:
            type: string
        status:
          allOf:
            - $ref: '#/components/schemas/ComplaintStatus'
          description: >
            Typically UNDER_RESOLUTION for batch processing. Only legal,
            officer-triggerable transitions are allowed — CLOSED, REJECTED,
            and UNDER_REVIEW are reserved for citizen confirmation and
            evidence review respectively, and are rejected per-item.
        reason:
          type: string
          description: Required if the target status needs one (e.g. UNRESOLVABLE).

    BatchStatusUpdateResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              complaintId:
                type: string
              success:
                type: boolean
              status:
                allOf:
                  - $ref: '#/components/schemas/ComplaintStatus'
                nullable: true
                description: The new status if it succeeded.
              error:
                type: string
                nullable: true
                description: Why it failed (e.g. "invalid transition", "not in your zone").
            required: [complaintId, success]
        summary:
          type: object
          properties:
            requested:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
      required: [results]

    ProgressNoteRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500

    DisputeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why the citizen believes the issue is not actually fixed.

    UpvoteResult:
      type: object
      properties:
        complaintId:
          type: string
        upvoteCount:
          type: integer
        severityLabel:
          $ref: '#/components/schemas/SeverityLabel'
      required: [complaintId, upvoteCount]

    ComplaintOverrideRequest:
      type: object
      description: Admin override — send only the fields to change.
      properties:
        status:
          $ref: '#/components/schemas/ComplaintStatus'
        categoryId:
          type: string
        zoneId:
          type: string
          description: Manually reassign the complaint to a different zone.
        reason:
          type: string
          description: Recommended — recorded in the status history.

    SlaUpdateRequest:
      type: object
      required: [targetHours]
      properties:
        targetHours:
          type: integer
          minimum: 1
          example: 72

    Settings:
      type: object
      properties:
        autoCloseTimeoutHours:
          type: integer
          minimum: 1
          description: How long a RESOLVED complaint waits for citizen confirmation before auto-closing.
          example: 168
      required: [autoCloseTimeoutHours]

    # ---- Gamification ----

    PointsLedgerEntry:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: Positive or negative CSP change.
          example: 50
        reason:
          type: string
          enum:
            - COMPLAINT_CLOSED
            - CLUSTER_MEMBER_CLOSED
            - FIRST_COMPLAINT
            - ON_TIME_BONUS
            - UPVOTE_RECEIVED
            - REJECTED_PENALTY
        complaintId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, amount, reason, createdAt]

    PointsSummary:
      type: object
      properties:
        totalLifetimeCsp:
          type: integer
          example: 245
        currentMonthCsp:
          type: integer
          example: 80
        ledger:
          type: array
          items:
            $ref: '#/components/schemas/PointsLedgerEntry'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [totalLifetimeCsp, currentMonthCsp]

    Badge:
      type: object
      properties:
        code:
          type: string
          enum:
            - KARTAVYA_INITIATE
            - STREET_GUARDIAN
            - ZONE_CHAMPION
            - CENTURY_REFORMER
            - CIVIC_HERO
            - SWIFT_REPORTER
        name:
          type: string
          example: Street Guardian
        description:
          type: string
          example: Got 5 complaints fixed.
        earnedAt:
          type: string
          format: date-time
      required: [code, name, earnedAt]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          example: 3
        citizenId:
          type: string
        displayName:
          type: string
          description: A public display name/handle (no private profile is exposed).
        points:
          type: integer
        isCurrentUser:
          type: boolean
        isTopThree:
          type: boolean
      required: [rank, citizenId, points]

    LeaderboardResponse:
      type: object
      properties:
        scope:
          type: string
          enum: [zone, city]
        period:
          type: string
          enum: [monthly, all_time]
        generatedAt:
          type: string
          format: date-time
        currentUser:
          allOf:
            - $ref: '#/components/schemas/LeaderboardEntry'
          nullable: true
          description: The caller's own rank, even if not in the visible page.
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required: [scope, period, data, pagination]

    # ---- Analytics ----

    CategoryBreakdownItem:
      type: object
      properties:
        categoryId:
          type: string
        categoryName:
          type: string
        count:
          type: integer

    ZoneAnalytics:
      type: object
      properties:
        zoneId:
          type: string
        zoneName:
          type: string
        activeComplaints:
          type: integer
        overdueCount:
          type: integer
        avgResolutionHoursThisMonth:
          type: number
          format: float
          nullable: true
        categoryBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreakdownItem'
      required: [zoneId, activeComplaints, overdueCount]

    ZoneMetrics:
      type: object
      properties:
        zoneId:
          type: string
        zoneName:
          type: string
        pending:
          type: integer
        overdue:
          type: integer
        resolvedThisMonth:
          type: integer
        avgResolutionHours:
          type: number
          format: float
          nullable: true
        isHighestOverdue:
          type: boolean
          description: True for the zone(s) with the most overdue complaints (for highlighting).
        topCitizens:
          type: array
          description: Top 3 citizens by CSP in this zone.
          items:
            $ref: '#/components/schemas/LeaderboardEntry'
        severityHeat:
          type: object
          description: Counts per severity, for the heatmap grid.
          properties:
            LOW:
              type: integer
            MEDIUM:
              type: integer
            HIGH:
              type: integer
            CRITICAL:
              type: integer

    SystemAnalytics:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneMetrics'
      required: [generatedAt, zones]

    OfficerPerformance:
      type: object
      properties:
        officerId:
          type: string
        zoneId:
          type: string
        period:
          type: string
        totalHandled:
          type: integer
        onTime:
          type: integer
        delayed:
          type: integer
        overdue:
          type: integer
        unresolvableExcluded:
          type: integer
          description: Count of UNRESOLVABLE complaints excluded from on-time/overdue figures.
        evidenceBreakdown:
          type: object
          properties:
            valid:
              type: integer
            needsMoreEvidence:
              type: integer
            rejected:
              type: integer
        acceptRejectRatio:
          type: number
          format: float
          nullable: true
        avgResolutionHours:
          type: number
          format: float
          nullable: true
      required: [officerId, totalHandled]

    PublicOfficerStats:
      type: object
      description: The only officer info a citizen may see.
      properties:
        officerId:
          type: string
        totalResolved:
          type: integer
      required: [officerId, totalResolved]

    # ---- AI ----

    CategorySuggestionRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: The citizen's free-text description, in any language.
          example: There is a deep hole in the middle of the road near the market.

    CategorySuggestionResponse:
      type: object
      properties:
        aiAvailable:
          type: boolean
          description: False if the AI model was unavailable (the form should just carry on).
        suggestedCategoryId:
          type: string
          nullable: true
        suggestedCategoryName:
          type: string
          nullable: true
        confidence:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
        reasoning:
          type: string
          nullable: true
          description: >
            A short plain-language note on why this category was suggested. Helps
            the UI explain the hint and reinforces that the citizen, not the AI,
            makes the final choice.
          example: The description mentions a hole in the road surface near the market.
        alternativeCategories:
          type: array
          description: Other plausible categories, ranked, so the citizen can pick easily if the top guess is wrong.
          items:
            type: object
            properties:
              categoryId:
                type: string
              categoryName:
                type: string
              confidence:
                type: number
                format: float
                minimum: 0
                maximum: 1
            required: [categoryId, categoryName]
      required: [aiAvailable]

    AiZoneReport:
      type: object
      properties:
        reportId:
          type: string
        zoneId:
          type: string
        status:
          type: string
          enum: [PENDING, READY, FAILED]
          description: PENDING right after triggering, READY when done, FAILED if the AI was unavailable.
        aiAvailable:
          type: boolean
        summary:
          type: string
          nullable: true
          description: The plain-English health summary (present when READY).
        trends:
          type: string
          nullable: true
        hotspots:
          type: string
          nullable: true
        suggestions:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
          nullable: true
      required: [reportId, zoneId, status, aiAvailable]
