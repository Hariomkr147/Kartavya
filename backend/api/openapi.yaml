  # ---------------------------------------------------------------------------
  # OFFICER
  # ---------------------------------------------------------------------------

  /officer/complaints:
    get:
      tags: [Officer]
      operationId: getOfficerQueue
      summary: Get my zone's complaint queue
      description: >
        Returns only the complaints in the officer's assigned zone, with the
        reporter's identity removed. By default they are sorted with the most
        urgent first (Critical severity and Overdue SLA at the top). Optional
        filters help the officer focus.


        An officer can never see another zone's complaints through this or any
        other endpoint.
      parameters:
        - name: status
          in: query
          description: Filter by one or more statuses.
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ComplaintStatus"
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SlaLabel"
        - name: severityLabel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SeverityLabel"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The officer's zone queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /officer/complaints/{complaintId}/claim:
    post:
      tags: [Officer]
      operationId: claimComplaint
      summary: Pick up a submitted complaint for evidence review
      description: >
        The officer picks a `SUBMITTED` complaint from their zone queue to
        start working on it. The complaint moves to `EVIDENCE_UNDER_REVIEW`
        and `assignedOfficerId` is set to the calling officer, so the queue
        shows other officers it is taken. This is the **only door** out of
        `SUBMITTED`: the evidence-review endpoint requires the complaint to
        already be at `EVIDENCE_UNDER_REVIEW`, and the generic status
        endpoint does not accept this transition. No request body — claiming
        is the whole action.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      responses:
        "200":
          description: Complaint claimed and moved to EVIDENCE_UNDER_REVIEW.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The complaint is not in the SUBMITTED stage — most likely another
            officer already claimed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/complaints/{complaintId}/evidence-review:
    post:
      tags: [Officer]
      operationId: reviewEvidence
      summary: Review the photo and give a verdict
      description: >
        The officer judges the submitted photo and picks exactly one verdict:


        - `VALID` — accepted. The complaint advances to `UNDER_REVIEW` and the
          SLA timer starts.

        - `NEEDS_MORE_EVIDENCE` — the citizen is asked for a better photo.
          A reason is **required**.

        - `REJECTED` — turned down as fake or invalid. The complaint is closed
          as rejected, a reason is **required**, and the citizen loses 20 CSP.
          **Only offered on a complaint's first evidence round** — i.e. one
          that has never yet reached `UNDER_REVIEW` (`sla_started_at` is still
          null). This call is also reached a second way: after an officer
          later recalls an already-accepted complaint via
          `PATCH /officer/complaints/{complaintId}/status` (see that
          endpoint's `UNDER_REVIEW` → `NEEDS_MORE_EVIDENCE` transition) and
          the citizen re-uploads. On that path `REJECTED` is not legal —
          the complaint was already validated once and may be actively being
          worked, so declaring it fake now would be a false accusation with a
          real point penalty. Only `VALID` (resumes at `UNDER_REVIEW`) or
          `NEEDS_MORE_EVIDENCE` (loop again) are available; requesting
          `REJECTED` here returns `409`.


        The verdict and reason are stored on the evidence record and become part
        of the permanent history. The AI confidence note (if any) is advisory
        only — the officer's verdict always wins.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceReviewRequest"
      responses:
        "200":
          description: Verdict recorded and the complaint moved accordingly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          description: A reason is required for NEEDS_MORE_EVIDENCE and REJECTED but was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The complaint is not at the evidence-review stage, or `REJECTED`
            was requested on a complaint that has already passed its first
            evidence round (see the description above).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/complaints/{complaintId}/status:
    patch:
      tags: [Officer]
      operationId: updateComplaintStatus
      summary: Move one complaint to the next stage
      description: >
        Moves a single complaint along the lifecycle. The server only allows
        legal transitions (see the `ComplaintStatus` schema for the full map).
        Examples an officer uses here:


        - `UNDER_REVIEW` → `IN_PROGRESS`

        - `IN_PROGRESS` → `UNDER_RESOLUTION`

        - `UNDER_RESOLUTION` → `RESOLVED` (optionally with a closing note)

        - `UNDER_REVIEW` → `NEEDS_MORE_EVIDENCE` (**reason required**) — the
          officer needs a better photo before proceeding, even though the
          complaint already passed its initial evidence check. Pauses the SLA
          clock; the citizen re-uploads through the normal evidence flow and
          the officer re-verdicts via evidence-review (only `VALID` or
          `NEEDS_MORE_EVIDENCE` are available there once a complaint has
          reached this stage — not `REJECTED`).

        - any active stage → `UNRESOLVABLE` (**reason required**)


        Marking `RESOLVED` does **not** close the complaint — the citizen must
        still confirm. An illegal jump (e.g. `SUBMITTED` → `RESOLVED`) is
        rejected with 409. A `REOPENED` complaint **cannot** be moved through
        this endpoint at all, by any officer — it must first go through
        `POST /admin/complaints/{complaintId}/dispute-review`, which is the
        only door out of `REOPENED`.


        **Cluster cascade:** if this complaint belongs to a cluster, moving it
        to `RESOLVED` automatically cascades every other member of the same
        cluster to `RESOLVED` too — every member that has passed evidence
        review and is not awaiting a dispute verdict (`UNDER_REVIEW`,
        `IN_PROGRESS`, `UNDER_RESOLUTION`) — recorded as its own
        `status_history` entry per complaint with actor `SYSTEM`. Members
        the move is not legal for are **skipped, never forced**: anything
        already terminal (`CLOSED`, `REJECTED`, `UNRESOLVABLE`), already
        `RESOLVED`, still in the evidence phase (`SUBMITTED`,
        `EVIDENCE_UNDER_REVIEW`, `NEEDS_MORE_EVIDENCE` — the evidence gate is
        never bypassed; those members keep going through review individually),
        or currently `REOPENED` (a pending dispute is never bypassed either —
        the complaint keeps waiting for an explicit admin verdict via
        `POST /admin/complaints/{complaintId}/dispute-review` no matter what
        happens elsewhere in the cluster) keeps its status. The response's
        `cascade` array reports the outcome (`CASCADED` or `SKIPPED`) for
        every other member, so the officer sees exactly what moved. This is
        the only automatic cascade in the system; no other status transition
        propagates across a cluster on its own. To move a cluster through an
        earlier stage together (e.g. `UNDER_RESOLUTION`), or to resolve only
        part of a cluster, use `POST /officer/complaints/batch-status`
        instead — see that endpoint for how it relates to this cascade.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: >
            Status updated; a new history entry was recorded. When the update
            set a clustered complaint to RESOLVED, `cascade` reports the
            outcome for every other member of the cluster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusUpdateResult"
        "400":
          description: A reason is required for UNRESOLVABLE or NEEDS_MORE_EVIDENCE but was missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That status change is not allowed from the current stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/complaints/batch-status:
    post:
      tags: [Officer]
      operationId: batchUpdateStatus
      summary: Apply the same status update to multiple complaints
      description: >
        Lets an officer apply the same status transition to multiple
        complaints in one action — for example, sending a whole street of
        pothole reports to `UNDER_RESOLUTION` together after monsoon damage.


        The target complaints may be selected in one of two ways:

        - provide `complaintIds` to update an explicit list of complaints.

        - provide `clusterId` to update every complaint belonging to that
          cluster at the time the request is processed.

        Exactly one of `complaintIds` or `clusterId` must be supplied —
        both or neither is a `400`.


        **Relationship to the cluster cascade:** only the `RESOLVED` transition
        cascades automatically (see `PATCH /officer/complaints/{complaintId}/status`)
        — no other stage does. This endpoint is how an officer batch-moves a
        cluster through an earlier stage together (e.g. sending it to
        `UNDER_RESOLUTION` as a group), or picks a specific subset of a
        cluster's complaints via `complaintIds` instead of all of them, or
        batches an arbitrary list that spans multiple clusters or no cluster
        at all. Calling this with `clusterId` and `status: RESOLVED` after the
        cascade has already resolved some members is safe: those members just
        come back as a per-item failure with `errorCode: INVALID_TRANSITION`,
        same as any other already-terminal complaint in a batch.


        The same rules as `PATCH /officer/complaints/{complaintId}/status`
        apply to every item: `status` only accepts the officer-triggerable
        targets (`OfficerTargetStatus` — statuses reserved for other doors,
        like `CLOSED` or the first-round-only `REJECTED`, are a schema-level
        `400`), and each item is still validated against the transition map
        from its own current status (`SUBMITTED` → `RESOLVED` is not legal;
        `UNRESOLVABLE` and `NEEDS_MORE_EVIDENCE` both require a `reason`, and
        `NEEDS_MORE_EVIDENCE` is only legal from `UNDER_REVIEW`). A complaint
        currently `REOPENED` fails every item in this batch with
        `errorCode: INVALID_TRANSITION` — like the single-item endpoint, this
        door never accepts `REOPENED` as a source status; only
        `POST /admin/complaints/{complaintId}/dispute-review` can move it.


        Each complaint is validated and recorded individually (its own history
        entry and timestamp), and the whole batch is processed in a single
        transaction. The response reports success or failure per-complaint
        with a machine-readable `errorCode`, so a single bad item does not
        silently fail the rest — an unknown ID in `complaintIds` is a
        per-item `UNKNOWN_COMPLAINT` failure, not a `404`. The frontend
        should show a confirmation prompt before calling this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchStatusUpdateRequest"
      responses:
        "200":
          description: Batch processed. Check each item's result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchStatusUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The supplied clusterId does not exist. (Unknown complaint IDs are reported per-item in the 200 response instead.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/complaints/{complaintId}/notes:
    post:
      tags: [Officer]
      operationId: addProgressNote
      summary: Post a progress note the citizen can see
      description: >
        The officer adds a short note (up to 500 characters) to a complaint that
        is `IN_PROGRESS` or `UNDER_RESOLUTION`. The note appears on the citizen's
        complaint page with the officer's ID (not name) and a timestamp. Notes
        are permanent — they cannot be edited or deleted, since they form an
        audit trail.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressNoteRequest"
      responses:
        "201":
          description: Note added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressNote"
        "400":
          description: Empty note or over 500 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Notes can only be added in the IN_PROGRESS or UNDER_RESOLUTION stages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/clusters/{clusterId}/notes:
    post:
      tags: [Officer]
      operationId: addClusterProgressNote
      summary: Add a progress update to every complaint in a cluster
      description: >
        Adds the same progress note (up to 500 characters) to every complaint
        belonging to the cluster at the time the request is processed —
        equivalent to posting `POST /officer/complaints/{complaintId}/notes`
        on each member individually, with the same rules: the note appears on
        each citizen's complaint page with the officer's ID (not name) and a
        timestamp, and is permanent.


        As with the single-complaint endpoint, a note can only be attached to
        a complaint that is `IN_PROGRESS` or `UNDER_RESOLUTION`. Members in
        any other stage are skipped; the response lists exactly the notes
        that were created, so a skipped member is visible as a missing entry.
        If no member is eligible, nothing is created and the request fails
        with `409`.


        Officers may only update clusters within their assigned zone.

      parameters:
        - $ref: "#/components/parameters/ClusterId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressNoteRequest"

      responses:
        "201":
          description: Notes added — one entry per complaint that received the note.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgressNote"

        "400":
          description: Empty note or over 500 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "409":
          description: No complaint in the cluster is in the IN_PROGRESS or UNDER_RESOLUTION stage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /officer/analytics:
    get:
      tags: [Officer]
      operationId: getOfficerAnalytics
      summary: Get analytics for my zone
      description: >
        Live analytics for the officer's own zone only: active complaints,
        overdue count, average resolution time this month, and a breakdown by
        category. The officer cannot see other zones or admin-level metrics.
      parameters:
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Zone analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # OFFICER (public stats for citizens)
  # ---------------------------------------------------------------------------

  /officers/{officerId}/stats:
    get:
      tags: [Officers (Public)]
      operationId: getPublicOfficerStats
      summary: Get an officer's public stats
      description: >
        A small, citizen-safe view of an officer — only their public ID and the
        total number of complaints they have resolved (like a delivery app
        rating). No personal details, no performance breakdown.
      parameters:
        - $ref: "#/components/parameters/OfficerId"
      responses:
        "200":
          description: Public officer stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOfficerStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # ADMIN — complaints
  # ---------------------------------------------------------------------------

  /admin/complaints:
    get:
      tags: [Admin]
      operationId: getAllComplaints
      summary: Get complaints across all zones
      description: >
        Admin view of every complaint, with full detail including reporter
        identity. Supports the same filters used for the dashboard and CSV
        export.
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ComplaintStatus"
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SlaLabel"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Filtered complaints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/complaints/{complaintId}:
    patch:
      tags: [Admin]
      operationId: overrideComplaint
      summary: Override a complaint
      description: >
        Administrative override of a complaint — for example, correcting the
        category, forcing a status, or manually reassigning it to a different
        zone (useful for the "Unassigned" catch-all). Every override is recorded
        in the status history with the admin as the actor.


        **SLA backfill:** forcing `status` to `UNDER_REVIEW` or any later stage
        skips the normal evidence-review path that would otherwise start the
        SLA timer. If the internal SLA-start timestamp is still unset when the
        override lands the complaint at `UNDER_REVIEW` or beyond, the server
        backfills it to now and snapshots `slaTargetHours` from the category's
        current SLA — the same values the evidence-review `VALID` verdict
        would have set — so `slaLabel` stays meaningful immediately after the
        override.
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintOverrideRequest"
      responses:
        "200":
          description: Complaint updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/complaints/{complaintId}/dispute-review:
    post:
      tags: [Admin]
      operationId: reviewDispute
      summary: Rule on a citizen's dispute
      description: >
        Renders the verdict on a `REOPENED` complaint — the **only** door out
        of `REOPENED`. An officer can no longer move a disputed complaint
        themselves; this endpoint is admin-only.


        - `UPHELD` — the citizen was right, the fix didn't hold. The
          complaint returns to `IN_PROGRESS`, back in the same officer's
          queue.

        - `REJECTED` — the original resolution stands. The complaint moves
          straight to `CLOSED`. **No points are credited** — same as an
          auto-close timeout — so a citizen cannot use a losing dispute to
          manufacture a second shot at the confirm reward they gave up by
          disputing instead of confirming.


        A `reason` is always required and is recorded on the `status_history`
        entry as the admin's justification. The citizen's dispute reason and
        photo (submitted with `POST /complaints/{complaintId}/dispute`) are
        available on the complaint's evidence history for the admin to weigh.


        This transition never cascades — only a move to `RESOLVED` cascades a
        cluster (see `PATCH /officer/complaints/{complaintId}/status`).
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeReviewRequest"
      responses:
        "200":
          description: Verdict recorded and the complaint moved accordingly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintDetail"
        "400":
          description: Missing verdict or reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The complaint is not currently `REOPENED` — most likely it was
            already ruled on. (A cluster cascade can never cause this: a
            `REOPENED` complaint is always skipped by the cascade, precisely
            so a pending dispute is never swept aside without an admin
            verdict.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # ADMIN — users
  # ---------------------------------------------------------------------------

  /admin/users:
    get:
      tags: [Admin]
      operationId: getAllUsers
      summary: List users
      description: List all accounts. Filterable by role and zone.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Role"
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The user list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a citizen or officer account
      description: >
        Creates a citizen or officer account. For an officer, exactly one
        `zoneId` is required — that is how officers are assigned to a zone at
        creation time. Admins cannot be created through the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{userId}:
    get:
      tags: [Admin]
      operationId: getUserById
      summary: Get one user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Update or deactivate a user
      description: >
        Edits a user's details, reassigns an officer to a new zone, or
        activates/deactivates an account via the `active` flag. **Deactivating**
        (rather than deleting) is the recommended way to disable an account: a
        deactivated user cannot log in, but all their complaints, points, and
        history stay intact for the audit trail. Reassigning an officer's zone
        takes effect immediately: they instantly lose access to the old
        zone's complaints, and every non-terminal complaint still assigned to
        them there has `assignedOfficerId` cleared back to `null` — those
        complaints become unassigned and available to whichever officer now
        covers that zone, rather than staying stuck with someone who can no
        longer see them.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new email is already taken by another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Admin]
      operationId: deleteUser
      summary: Permanently delete a user (use with care)
      description: >
        Hard-deletes an account. **Prefer deactivation** (`PATCH` with
        `active: false`) instead — deleting a user who already has complaints,
        points, evidence reviews, progress notes, or status changes on record
        will be refused. This endpoint is intended only for truly empty/test
        accounts.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: User deleted (no content).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This account has linked records and cannot be hard-deleted. Deactivate it instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # ADMIN — zones, SLAs, settings
  # ---------------------------------------------------------------------------

  /admin/zones:
    post:
      tags: [Admin]
      operationId: createZone
      summary: Create a zone
      description: >
        Creates a new admin-managed zone with a stable code, a display name, and
        a centre point. The centre is what nearest-zone matching uses. The code
        is permanent once set; only the name can be changed later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneRequest"
      responses:
        "201":
          description: Zone created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A zone with this code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/zones/{zoneId}:
    patch:
      tags: [Admin]
      operationId: updateZone
      summary: Rename or deactivate a zone
      description: >
        Updates a zone's display name, or deactivates/reactivates it via the
        `isActive` flag. **The zone code cannot be changed** — it is a stable
        identifier used across the system. Deactivating is the safe alternative
        to deletion: the zone stops accepting new complaints but keeps all its
        history. Moving a zone's centre is deliberately not offered here, because
        existing complaints keep their originally assigned zone regardless.
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneRequest"
      responses:
        "200":
          description: Zone updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      operationId: deleteZone
      summary: Delete a zone (only if unused)
      description: >
        Permanently deletes a zone. Allowed **only** if nothing references it —
        no complaints, no assigned officers, and no citizens whose home zone
        is this one (registration requires a home zone, so in practice any
        zone that has ever had a citizen sign up against it is blocked too,
        not just zones with complaints or officers). If anything does, the
        delete is refused with `409`, and the admin should deactivate the
        zone instead. The catch-all "Unassigned" zone can never be deleted.
        This endpoint exists mainly to clean up zones created by mistake,
        before real citizens have registered against them.
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "204":
          description: Zone deleted (no content).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The zone has complaints, assigned officers, or citizens whose home zone is this one (or it is the catch-all) and cannot be deleted. Deactivate it instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/zones/{zoneId}/assign-officer:
    post:
      tags: [Admin]
      operationId: assignOfficerToZone
      summary: Assign an officer to a zone
      description: >
        Assigns (or reassigns) an existing officer to this zone. The change is
        immediate: the officer instantly loses access to the old zone's
        complaints and gains access to this zone's. If this is a reassignment,
        every non-terminal complaint still assigned to them in the old zone
        has `assignedOfficerId` cleared back to `null`, the same as
        `PATCH /admin/users/{userId}`.
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignOfficerRequest"
      responses:
        "200":
          description: Officer assigned to the zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: The user is not an officer, or the officer/zone does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/slas/{categoryId}:
    patch:
      tags: [Admin]
      operationId: updateSla
      summary: Set a category's SLA target time
      description: >
        Updates the target resolution time (in hours) for one category. The new
        value applies to complaints accepted **after** the change; complaints
        already in progress keep the target they started with. Minimum 1 hour.
        To read current targets, use `GET /categories`.
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaUpdateRequest"
      responses:
        "200":
          description: SLA target updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Target below the 1-hour minimum, or zero/negative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Get system settings
      description: Returns adjustable system-wide settings, such as the auto-close timeout.
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Admin]
      operationId: updateSettings
      summary: Update system settings
      description: >
        Updates system-wide settings. The main one here is
        `autoCloseTimeoutHours` — how long a `RESOLVED` complaint waits for the
        citizen to respond before it auto-closes. An auto-close credits no
        points; only an explicit citizen confirm does.


        **The setting is a live rule, not a deadline stamped on each
        complaint.** A background sweeper periodically closes every complaint
        where `resolved_at + autoCloseTimeoutHours <= now`, re-reading the
        setting each pass. Lowering the value therefore closes complaints that
        are already waiting — possibly on the very next sweep, immediately and
        in bulk — and raising it hands more time back to complaints already in
        flight. Nothing is scheduled in advance and nothing is retroactively
        un-closed, so a complaint the sweeper has already closed stays closed
        whatever the setting becomes afterwards. Admin UIs should warn before
        applying a decrease.


        The sweep cadence itself is deployment configuration
        (`AUTO_CLOSE_SWEEP_MINUTES`, default 15), not part of this contract:
        it bounds only how long after the deadline a complaint lingers, never
        whether it closes. Clients must not assume a complaint closes at the
        exact instant the timeout elapses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # ADMIN — analytics, officer performance, AI report, export
  # ---------------------------------------------------------------------------

  /admin/analytics:
    get:
      tags: [Admin]
      operationId: getSystemAnalytics
      summary: Get all-zone analytics
      description: >
        Live, cross-zone dashboard data: per-zone pending/overdue/resolved
        counts and average resolution time, which zones have the most overdue
        complaints, the top 3 citizens by points in each zone, and a
        severity heatmap grid. Always reflects the current database state.
      responses:
        "200":
          description: System analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/officers/{officerId}/performance:
    get:
      tags: [Admin]
      operationId: getOfficerPerformance
      summary: Monitor one officer's performance
      description: >
        A per-officer scorecard: total handled, on-time/delayed/overdue
        resolutions, and the evidence accept/reject breakdown. Complaints marked
        `UNRESOLVABLE` are excluded from the on-time/overdue figures so officers
        are not penalised for things outside their control. Filterable by time
        period.
      parameters:
        - $ref: "#/components/parameters/OfficerId"
        - name: period
          in: query
          description: Convenience window for the stats.
          required: false
          schema:
            type: string
            enum: [this_month, last_month, all_time]
            default: this_month
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Officer performance summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficerPerformance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/zones/{zoneId}/ai-report:
    post:
      tags: [Admin]
      operationId: generateAiZoneReport
      summary: Generate an AI zone health report
      description: >
        Kicks off generation of a plain-English civic-health summary for a zone,
        built from its live numbers. Generation is **asynchronous and
        non-blocking** — the admin can keep using the dashboard. This call
        returns straight away with a `reportId` and a `PENDING` status; poll the
        matching `GET` to fetch the finished report.


        If the AI model is unavailable, the report comes back with status
        `FAILED` and `aiAvailable: false`, and the rest of the dashboard keeps
        working.
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "202":
          description: Report generation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiZoneReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Admin]
      operationId: getAiZoneReport
      summary: Get the latest AI zone report
      description: >
        Returns the most recently generated report for the zone (stored, so it
        can be viewed again without regenerating). While a report is still being
        produced, its status is `PENDING`; once ready it is `READY` with the full
        text.
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "200":
          description: The stored report (may still be PENDING).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiZoneReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No report has ever been generated for this zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/export/complaints:
    get:
      tags: [Admin]
      operationId: exportComplaintsCsv
      summary: Export complaints as CSV
      description: >
        Downloads the filtered complaint set as a CSV file. Columns: ID,
        category, zone, status, severity, timestamps, SLA label, and officer ID.
        Citizen personal details are deliberately excluded. Works for both small
        and large (1,000+) result sets.
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ComplaintStatus"
        - name: slaLabel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SlaLabel"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: A CSV file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ---------------------------------------------------------------------------
  # GAMIFICATION
  # ---------------------------------------------------------------------------

  /gamification/points:
    get:
      tags: [Gamification]
      operationId: getMyPoints
      summary: Get my points
      description: >
        Returns the citizen's total lifetime CSP and this month's CSP, plus a
        paged ledger of every points change (so the total is always auditable
        and never a single editable number).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Points summary and ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /gamification/badges:
    get:
      tags: [Gamification]
      operationId: getMyBadges
      summary: Get my badges
      description: Returns the badges the citizen has earned, each with the date earned.
      responses:
        "200":
          description: Earned badges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /leaderboard:
    get:
      tags: [Gamification]
      operationId: getLeaderboard
      summary: Get the leaderboard
      description: >
        Returns ranked citizens for either the **zone** or the **city** scope.
        Monthly rankings reset at the start of each month; lifetime totals never
        reset. The response also includes the caller's own rank, so the
        dashboard can show "you are #7" even if they are not in the visible top
        slice. The top 3 are flagged for highlighting.


        **Who is on the board.** Active citizens only: `role = CITIZEN` and
        `is_active = true`. Officers and admins never appear — they earn no
        points. A deactivated citizen is dropped from the rankings entirely
        and everyone below them moves up; the account keeps its
        `points_ledger` history, so reactivating restores its place. Citizens
        with a zero (or negative) total for the period **do** appear, at the
        bottom — a new citizen seeing themselves ranked last is the nudge the
        feature exists for. Under `scope=zone` the board covers the caller's
        own `zoneId` only.


        **Ordering and ties.** Sort by `points` descending, then by account
        age (older account first), then by `citizenId` ascending as a final
        tiebreak so the order is total and stable across pages — the same
        request twice must never interleave rows differently. Ranks are
        **sequential, never shared**: tied citizens get consecutive numbers in
        that order, so `rank` is always `1..N` with no gaps or repeats and
        `isTopThree` is exactly `rank <= 3`. Pagination applies after ranking,
        so a citizen's `rank` does not depend on which page it is read from.


        **`currentUser`.** The caller's own row, computed against the full
        ranking rather than the returned page, so it is correct no matter
        which page was requested. `null` only when the caller has no row on
        this board at all — i.e. they are not a ranked citizen.
      parameters:
        - name: scope
          in: query
          required: true
          description: Rank within the caller's zone, or across the whole city.
          schema:
            type: string
            enum: [zone, city]
        - name: period
          in: query
          required: false
          description: Current month's ranking (default) or all-time.
          schema:
            type: string
            enum: [monthly, all_time]
            default: monthly
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Leaderboard rankings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
        "400":
          description: Missing or invalid scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Send the JWT from login as `Authorization: Bearer <token>`."

  # ---------------------------------------------------------------------------
  # Reusable parameters
  # ---------------------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number for paged lists.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Items per page.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: >
        Optional sort order. Use a field name, prefixed with `-` for descending.
        Supported fields on complaint lists: `createdAt`, `updatedAt`,
        `severity`, `sla`, `upvotes`. Example: `-createdAt` (newest first).
        If omitted, each endpoint uses its documented default order.
      required: false
      schema:
        type: string
        example: -createdAt
    DateFrom:
      name: dateFrom
      in: query
      description: Include records on or after this date/time (ISO 8601).
      required: false
      schema:
        type: string
        format: date-time
    DateTo:
      name: dateTo
      in: query
      description: Include records on or before this date/time (ISO 8601).
      required: false
      schema:
        type: string
        format: date-time
    ComplaintId:
      name: complaintId
      in: path
      required: true
      schema:
        type: string
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: string
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
    OfficerId:
      name: officerId
      in: path
      required: true
      schema:
        type: string

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: The request was malformed or a required field was missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid token was provided.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: You are authenticated but not allowed to do this (wrong role or wrong zone).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # ---- Shared enums ----

    Role:
      type: string
      description: The kind of account. SYSTEM is never a valid account role — see StatusActor for automated status changes.
      enum: [CITIZEN, OFFICER, ADMIN]

    StatusActor:
      type: string
      description: >
        Who or what caused a status_history entry. Distinct from Role because
        SYSTEM changes exist — e.g. auto-closing a RESOLVED complaint after
        the configured timeout, or cascading all members of a cluster to
        RESOLVED together when the officer resolves the shared issue.
      enum: [CITIZEN, OFFICER, ADMIN, SYSTEM]

    ComplaintStatus:
      type: string
      description: >
        The stage a complaint is in. The server enforces these transitions:


        - `SUBMITTED` → `EVIDENCE_UNDER_REVIEW`

        - `EVIDENCE_UNDER_REVIEW` → `UNDER_REVIEW` (Valid) | `NEEDS_MORE_EVIDENCE` |
          `REJECTED` (only on a complaint's first evidence round, before it
          has ever reached `UNDER_REVIEW`)

        - `NEEDS_MORE_EVIDENCE` → `EVIDENCE_UNDER_REVIEW` (citizen re-uploads —
          this is the one edge shared by both the pre-acceptance loop and the
          post-acceptance recall below)

        - `UNDER_REVIEW` → `IN_PROGRESS`

        - `UNDER_REVIEW` → `NEEDS_MORE_EVIDENCE` (officer recalls an
          already-accepted complaint for better evidence; **reason
          required**; pauses the running SLA clock. The citizen re-uploads
          the same way as above, and the officer re-verdicts — `VALID`
          resumes at `UNDER_REVIEW`, `REJECTED` is not offered here)

        - `IN_PROGRESS` → `UNDER_RESOLUTION`

        - `UNDER_RESOLUTION` → `RESOLVED`

        - `RESOLVED` → `CLOSED` (citizen confirms, or the auto-close timeout
          fires as `SYSTEM` — the timeout credits no points) | `REOPENED`
          (citizen disputes; a reason and a fresh photo are both required)

        - `REOPENED` → `IN_PROGRESS` (dispute upheld) | `CLOSED` (dispute
          rejected — **no points credited**, same as an auto-close). Both are
          **admin-only**, rendered via
          `POST /admin/complaints/{complaintId}/dispute-review` — no officer
          endpoint, single or batch, and no cluster cascade, can move a
          complaint out of `REOPENED`.

        - any active stage (`UNDER_REVIEW`, `IN_PROGRESS`, `UNDER_RESOLUTION`) → `UNRESOLVABLE`


        **`SYSTEM`-only exception — the cluster cascade:** when one member of
        a cluster reaches `RESOLVED`, every other member that has already
        passed evidence review (`UNDER_REVIEW`, `IN_PROGRESS`,
        `UNDER_RESOLUTION`) is moved straight to `RESOLVED` with actor
        `SYSTEM`. This is the only place a complaint may skip intermediate
        stages; no user-triggered endpoint can. Members still in the
        evidence phase (`SUBMITTED`, `EVIDENCE_UNDER_REVIEW`,
        `NEEDS_MORE_EVIDENCE`) are never cascaded — their photos still need a
        verdict, so the evidence gate (and its `REJECTED` penalty) cannot be
        bypassed by riding a cluster resolution. A `REOPENED` member is never
        cascaded either, for the same reason: a pending dispute always waits
        for an explicit admin verdict, never swept along by an unrelated
        sibling's resolution.


        `REJECTED`, `CLOSED`, and `UNRESOLVABLE` are terminal.
      enum:
        - SUBMITTED
        - EVIDENCE_UNDER_REVIEW
        - NEEDS_MORE_EVIDENCE
        - REJECTED
        - UNDER_REVIEW
        - IN_PROGRESS
        - UNDER_RESOLUTION
        - RESOLVED
        - CLOSED
        - REOPENED
        - UNRESOLVABLE

    OfficerTargetStatus:
      type: string
      description: >
        The statuses an officer may target through the status and
        batch-status endpoints. Every other status is reached through its own
        dedicated door — claim (EVIDENCE_UNDER_REVIEW), evidence-review
        (UNDER_REVIEW / REJECTED, plus NEEDS_MORE_EVIDENCE on a complaint's
        first evidence round), citizen confirm (CLOSED), citizen dispute
        (REOPENED), and the admin's dispute-review verdict (IN_PROGRESS or
        CLOSED **from `REOPENED` specifically**) — so requesting one of those
        here is a schema-level error, not just a 409. `NEEDS_MORE_EVIDENCE` is
        the one status reachable both ways: evidence-review sets it on the
        first round (before `UNDER_REVIEW`), and this generic status door
        sets it again later — legal only from `UNDER_REVIEW` — when an
        officer needs to recall an already-accepted complaint for better
        evidence. `IN_PROGRESS` itself stays a normal officer-reachable
        target, but only from `UNDER_REVIEW` — an officer can no longer reach
        it from `REOPENED`; that source status is admin-only.
      enum:
        - IN_PROGRESS
        - UNDER_RESOLUTION
        - RESOLVED
        - UNRESOLVABLE
        - NEEDS_MORE_EVIDENCE

    SeverityLabel:
      type: string
      description: Auto-calculated from nearby reports and upvotes. Officers can see it but not change it.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    SlaLabel:
      type: string
      description: On Time (<80% of target), Delayed (80–100%), Overdue (>100%).
      enum: [ON_TIME, DELAYED, OVERDUE]

    EvidenceVerdict:
      type: string
      enum: [VALID, NEEDS_MORE_EVIDENCE, REJECTED]

    DisputeVerdict:
      type: string
      description: >
        The admin's ruling on a citizen's dispute. Deliberately a separate
        enum from `EvidenceVerdict` — an admin adjudicating a dispute and an
        officer judging a photo are different reviewers making different
        calls, and reusing one vocabulary for both would blur that.
      enum:
        - UPHELD
        - REJECTED

    # ---- Error ----

    Error:
      type: object
      description: A consistent error shape used everywhere.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A short machine-readable code, e.g. "VALIDATION_ERROR", "INVALID_TRANSITION".
              example: VALIDATION_ERROR
            message:
              type: string
              description: A human-friendly explanation.
              example: A reason is required when rejecting a complaint.
            details:
              type: array
              description: Optional per-field problems.
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: reason
                  issue:
                    type: string
                    example: must not be empty
          required: [code, message]
      required: [error]

    # ---- Pagination ----

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalItems:
          type: integer
          example: 137
        totalPages:
          type: integer
          example: 7
      required: [page, pageSize, totalItems, totalPages]

    # ---- Auth ----

    RegisterRequest:
      type: object
      required: [name, email, password, zoneId]
      properties:
        name:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
          example: asha@example.com
        password:
          type: string
          format: password
          minLength: 8
        zoneId:
          type: string
          description: The zone the citizen lives in or reports from.
          example: zone_012

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: The JWT to send on later requests.
        tokenType:
          type: string
          example: Bearer
        expiresAt:
          type: string
          format: date-time
          description: >
            When this token stops being accepted (issue time +
            `JWT_TTL_HOURS`, default 24 h). Mirrors the JWT's own `exp` claim
            so a client can pre-empt expiry without decoding the token.
            **There is no refresh endpoint** — after this moment every
            request returns `401` and the client must send the user back to
            login. Clients must still handle `401` at any time, since a token
            can also be invalidated early (for example when an admin
            deactivates the account).
          example: "2026-07-27T09:15:00Z"
        user:
          $ref: "#/components/schemas/User"
      required: [token, tokenType, expiresAt, user]

    # ---- User ----

    User:
      type: object
      description: An account. Password is never returned.
      properties:
        id:
          type: string
          example: user_1001
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          description: >
            Public handle shown on leaderboards and other citizen-facing
            surfaces (no private profile is ever exposed). If null, the app
            shows a masked placeholder like "Citizen #1042". Self-editable
            via `PATCH /users/me`.
        zoneId:
          type: string
          nullable: true
          description: The officer's assigned zone, or the citizen's home zone. Null for admins.
        active:
          type: boolean
          description: Deactivated accounts cannot log in.
          example: true
        createdAt:
          type: string
          format: date-time
      required: [id, role, name, active]

    CreateUserRequest:
      type: object
      required: [role, name, email, password]
      properties:
        role:
          type: string
          enum: [CITIZEN, OFFICER]
          description: Admins cannot be created here.
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        zoneId:
          type: string
          description: Required when role is OFFICER (exactly one zone). Optional/home-zone for CITIZEN.

    UpdateUserRequest:
      type: object
      description: All fields optional — send only what changes.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        zoneId:
          type: string
          description: Reassign an officer to a new zone (takes effect immediately).
        active:
          type: boolean
          description: Set false to deactivate (recommended over deletion), true to reactivate.

    AssignOfficerRequest:
      type: object
      required: [officerId]
      properties:
        officerId:
          type: string

    UpdateProfileRequest:
      type: object
      description: Self-service profile edit. All fields optional — send only what changes.
      properties:
        displayName:
          type: string
          nullable: true
          description: Set to null to revert to the auto-generated masked placeholder.
        name:
          type: string
        email:
          type: string
          format: email
        zoneId:
          type: string
          description: >
            Change your home zone. CITIZEN only — an OFFICER sending this
            gets 403, since their zone is a work assignment managed by an
            admin (see PATCH /admin/users/{userId} and
            POST /admin/zones/{zoneId}/assign-officer).

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8

    # ---- Reference ----

    Category:
      type: object
      properties:
        id:
          type: string
          example: cat_pothole
        code:
          type: string
          description: >
            Stable identifier, fixed when the category is seeded (a rename never
            changes it). The 12 categories are seeded once and the list is not
            editable from the app, so clients may safely key behaviour off this
            value — `name` is a display label and must not be used as a key.
          example: POTHOLE
        name:
          type: string
          example: Pothole
        description:
          type: string
          example: A hole in the road surface that can damage vehicles or injure people.
        slaTargetHours:
          type: integer
          description: Current target resolution time in hours.
          example: 72
      required: [id, code, name, slaTargetHours]

    Zone:
      type: object
      properties:
        id:
          type: string
          example: zone_012
        code:
          type: string
          description: Stable identifier, fixed once the zone is created (a rename never changes it).
          example: WARD-12-N
        name:
          type: string
          example: Ward 12 – North
        isCatchAll:
          type: boolean
          description: True for the single "Unassigned" fallback zone.
          default: false
        isActive:
          type: boolean
          description: Deactivated zones are hidden from new complaint filing but keep their history.
          default: true
      required: [id, code, name, isCatchAll, isActive]

    CreateZoneRequest:
      type: object
      required: [code, name, centerLat, centerLng]
      properties:
        code:
          type: string
          description: Stable identifier. Cannot be changed later.
          example: WARD-12-N
        name:
          type: string
          example: Ward 12 – North
        centerLat:
          type: number
          format: double
          description: >
            Zone centre. Routing uses nearest-centroid — a location belongs to
            whichever zone's centre it is closest to, so every coordinate maps
            to exactly one zone with no gaps or overlaps.
        centerLng:
          type: number
          format: double

    UpdateZoneRequest:
      type: object
      description: All fields optional. The zone code cannot be changed here.
      properties:
        name:
          type: string
          description: Rename the zone (display name only).
        isActive:
          type: boolean
          description: Set false to deactivate the zone instead of deleting it.

    ZoneSuggestionRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946

    ZoneSuggestionResponse:
      type: object
      description: The nearest zone to a location, used to pre-fill the complaint form's zone picker. Advisory only.
      properties:
        suggestedZone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
          description: The closest active zone by centre distance, or null if every zone in the system is deactivated.
      required: [suggestedZone]

    # ---- Complaint ----

    CreateComplaintRequest:
      type: object
      required: [categoryId, photos, latitude, longitude, zoneId]
      properties:
        categoryId:
          type: string
          description: >
            One of the 12 categories, always the citizen's confirmed choice —
            whether they accepted the client-side keyword match or picked it
            themselves (see `categorySuggestedByMatcher`).
          example: cat_pothole
        description:
          type: string
          description: Free-text description of the issue.
        photos:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            format: binary
          description: >
            1 to 3 photos (JPEG or PNG, max 5 MB each). Each becomes its own
            evidence record (`sequence` 1, 2, 3…) with its own independent AI
            pre-screening note.
        latitude:
          type: number
          format: double
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946
        zoneId:
          type: string
          description: >
            The zone the citizen confirmed for this complaint. There are
            exactly two ways the client arrives at this value: if the photo
            has usable EXIF GPS, the client calls `/zones/suggest` and
            pre-fills the zone picker with the result; otherwise the citizen
            selects a zone manually from the dropdown. Either way, the
            citizen sees and confirms a specific zone before the form can be
            submitted, so this is always required — there is no third path
            where no zone was ever selected. The server trusts the submitted
            value rather than re-deriving it from `latitude`/`longitude`,
            except it still checks the zone is active — a `zoneId` for a
            deactivated zone is rejected with `400` rather than silently
            accepted or rerouted, since the client's cached zone list may be
            stale.
          example: zone_012
        categorySuggestedByMatcher:
          type: boolean
          description: >
            Whether the citizen accepted the category the client's offline
            keyword matcher proposed, rather than picking one themselves (for
            analytics only — it never affects routing or the lifecycle).


            There is no AI category suggestion: matching is done entirely on the
            client from a fixed keyword lexicon, because the category list is
            closed and seeded once. The server records this flag as reported and
            does not re-derive it.
          default: false

    Complaint:
      type: object
      description: A compact complaint, used in lists and queues.
      properties:
        id:
          type: string
          example: cmp_5001
        category:
          $ref: "#/components/schemas/Category"
        status:
          $ref: "#/components/schemas/ComplaintStatus"
        severityLabel:
          $ref: "#/components/schemas/SeverityLabel"
        slaLabel:
          $ref: "#/components/schemas/SlaLabel"
        upvoteCount:
          type: integer
          example: 14
        photoUrl:
          type: string
          format: uri
          description: >
            A signed, expiring link to the complaint's first evidence photo —
            see `GET /evidence/{evidenceId}/photo`. Root-relative. Opaque to
            the client: use it as-is, do not parse or store it.
        zoneId:
          type: string
        zoneName:
          type: string
        assignedOfficerId:
          type: string
          nullable: true
          description: The officer's public ID (never their name).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        citizenActionNeeded:
          type: string
          nullable: true
          description: A hint for the citizen dashboard, e.g. "CONFIRM_FIX" or "PROVIDE_MORE_EVIDENCE".
          enum: [CONFIRM_FIX, PROVIDE_MORE_EVIDENCE]
      required: [id, category, status, createdAt]

    ComplaintDetail:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          properties:
            description:
              type: string
            latitude:
              type: number
              format: double
            longitude:
              type: number
              format: double
            severityScore:
              type: integer
              description: >
                The raw score behind the label = (unique_reporter_count − 1) ×
                3 + upvote count. unique_reporter_count is the number of
                distinct citizens who have reported this complaint's issue
                (via its cluster), not the raw number of reports — so one
                citizen filing the same complaint repeatedly cannot inflate
                severity. A standalone complaint (no cluster) contributes 0
                from this term, plus its own upvotes.
              example: 17
            slaTargetHours:
              type: integer
              nullable: true
              description: Set once the complaint is accepted (UNDER_REVIEW); null before that.
            clusterId:
              type: string
              nullable: true
              description: Set if this complaint is linked to nearby duplicates.
            reporter:
              allOf:
                - $ref: "#/components/schemas/User"
              nullable: true
              description: Only present for admins. Always omitted from officer and feed views.
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"
            statusHistory:
              type: array
              items:
                $ref: "#/components/schemas/StatusHistoryEntry"
            progressNotes:
              type: array
              items:
                $ref: "#/components/schemas/ProgressNote"

    ComplaintListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Complaint"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, pagination]

    FeedItem:
      type: object
      description: A feed entry — never includes who filed it.
      properties:
        id:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        status:
          $ref: "#/components/schemas/ComplaintStatus"
        severityLabel:
          $ref: "#/components/schemas/SeverityLabel"
        upvoteCount:
          type: integer
        hasUpvoted:
          type: boolean
          description: Whether the calling citizen has already upvoted this one.
        photoUrl:
          type: string
          format: uri
          description: >
            A signed, expiring link to the first evidence photo — see
            `GET /evidence/{evidenceId}/photo`. Carries no reporter identity,
            which is what makes it safe in the anonymised feed.
        latitude:
          type: number
          format: double
          description: >
            Same coordinate captured at filing time. Lets the client derive a
            nearby-landmark hint (e.g. via reverse geocoding) — never used to
            identify who reported the issue.
          example: 12.9716
        longitude:
          type: number
          format: double
          example: 77.5946
        createdAt:
          type: string
          format: date-time
      required: [id, category, status, upvoteCount, hasUpvoted]

    FeedListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, pagination]

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required: [data, pagination]

    # ---- Evidence / history / notes ----

    Evidence:
      type: object
      properties:
        id:
          type: string
        photoUrl:
          type: string
          format: uri
          description: >
            A signed, expiring link to this row's image — see
            `GET /evidence/{evidenceId}/photo`. Re-minted on every read, so
            two reads of the same evidence return two different strings for
            the same picture; never use it as an identity or a cache key.
        sequence:
          type: integer
          description: 1 for the original photo, 2+ for re-submissions.
          example: 1
        aiConfidenceNote:
          $ref: "#/components/schemas/AiConfidenceNote"
        verdict:
          allOf:
            - $ref: "#/components/schemas/EvidenceVerdict"
          nullable: true
          description: Null until the officer reviews it.
        verdictReason:
          type: string
          nullable: true
          description: Required for NEEDS_MORE_EVIDENCE and REJECTED.
        reviewedByOfficerId:
          type: string
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required: [id, photoUrl, sequence, submittedAt]

    AiConfidenceNote:
      type: object
      description: The AI photo pre-screening result. Advisory only — the officer decides.
      properties:
        aiAvailable:
          type: boolean
          description: False if the AI model was down when the photo was submitted.
          example: true
        matchesCategory:
          type: boolean
          nullable: true
          description: Whether the photo appears to match the chosen category.
        confidence:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          example: 0.82
        note:
          type: string
          nullable: true
          example: Photo appears to show a pothole, consistent with the selected category.
      required: [aiAvailable]

    StatusHistoryEntry:
      type: object
      description: One recorded stage change — the full audit trail.
      properties:
        id:
          type: string
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/ComplaintStatus"
          nullable: true
        toStatus:
          $ref: "#/components/schemas/ComplaintStatus"
        changedByRole:
          $ref: "#/components/schemas/StatusActor"
        changedByOfficerId:
          type: string
          nullable: true
          description: Officer's public ID when an officer made the change.
        reason:
          type: string
          nullable: true
          description: Present for things like REJECTED, UNRESOLVABLE, or a dispute.
        remark:
          type: string
          nullable: true
          description: >
            Optional free-text remark distinct from reason — for example the
            officer's closing note (StatusUpdateRequest.note) when marking
            RESOLVED.
        timestamp:
          type: string
          format: date-time
      required: [id, toStatus, changedByRole, timestamp]

    ProgressNote:
      type: object
      properties:
        id:
          type: string
        officerId:
          type: string
          description: The officer's public ID (not name).
        text:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
      required: [id, officerId, text, createdAt]

    # ---- Request bodies for actions ----

    SubmitEvidenceRequest:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPEG or PNG, max 5 MB.

    EvidenceReviewRequest:
      type: object
      required: [verdict]
      properties:
        verdict:
          $ref: "#/components/schemas/EvidenceVerdict"
        reason:
          type: string
          description: Required when verdict is NEEDS_MORE_EVIDENCE or REJECTED.

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/OfficerTargetStatus"
        reason:
          type: string
          description: Required when moving to UNRESOLVABLE or NEEDS_MORE_EVIDENCE.
        note:
          type: string
          description: Optional closing note when marking RESOLVED.

    StatusUpdateResult:
      type: object
      required: [complaint]
      properties:
        complaint:
          $ref: "#/components/schemas/ComplaintDetail"
        cascade:
          type: array
          description: >
            Present only when this update set a clustered complaint to
            RESOLVED — one entry per other member of the cluster. CASCADED
            members were moved to RESOLVED with their own SYSTEM history
            entry; SKIPPED members were left untouched because the move is
            not legal for them (already terminal, already RESOLVED, still
            in the evidence phase, or currently REOPENED awaiting an admin's
            dispute-review verdict). Absent for standalone complaints and for
            every non-RESOLVED update.
          items:
            type: object
            required: [complaintId, outcome, previousStatus]
            properties:
              complaintId:
                type: string
              outcome:
                type: string
                enum: [CASCADED, SKIPPED]
              previousStatus:
                $ref: "#/components/schemas/ComplaintStatus"

    BatchStatusUpdateRequest:
      type: object
      required:
        - status
      oneOf:
        - required: [complaintIds]
        - required: [clusterId]

      properties:
        complaintIds:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            Explicit list of complaint IDs to update. Exactly one of
            complaintIds or clusterId must be supplied — the oneOf above
            enforces it, so both or neither fails schema validation (400).
            Unknown IDs are reported as per-item failures in the result, not
            a 404.
          items:
            type: string

        clusterId:
          type: string
          description: >
            Update every complaint belonging to this cluster at the time the
            request is processed. Exactly one of complaintIds or clusterId
            must be supplied (enforced by the oneOf above). An unknown
            clusterId is a 404. Clusters are zone-scoped, but every member is
            still zone-checked individually — a member whose zone was later
            changed by an admin override fails per-item with NOT_IN_ZONE
            instead of being silently updated.

        status:
          allOf:
            - $ref: "#/components/schemas/OfficerTargetStatus"
          description: >
            Typically UNDER_RESOLUTION for batch processing. Statuses
            reserved for other doors (CLOSED, first-round REJECTED,
            UNDER_REVIEW, ...) are not in the enum at all, and each item is
            still validated against the transition map individually — e.g.
            NEEDS_MORE_EVIDENCE only succeeds for items currently at
            UNDER_REVIEW, letting an officer recall a batch of
            already-accepted complaints for better evidence in one call.

        reason:
          type: string
          description: >
            Required if the target status needs one (UNRESOLVABLE or
            NEEDS_MORE_EVIDENCE).

        note:
          type: string
          description: >
            Optional closing note when marking RESOLVED — the same note is
            attached to every complaint in the batch. Officers who need a
            different note per complaint should resolve those individually.


    TransitionFailureCode:
      type: string
      description: Machine-readable reason a per-item status update failed.
      enum:
        - INVALID_TRANSITION   # not legal from the complaint's current status
        - NOT_IN_ZONE          # outside the calling officer's assigned zone
        - UNKNOWN_COMPLAINT    # no complaint with this ID exists
        - REASON_REQUIRED      # the target status needs a reason and none was given

    BatchStatusUpdateResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              complaintId:
                type: string
              success:
                type: boolean
              status:
                allOf:
                  - $ref: "#/components/schemas/ComplaintStatus"
                nullable: true
                description: The new status if it succeeded.
              previousStatus:
                allOf:
                  - $ref: "#/components/schemas/ComplaintStatus"
                nullable: true
                description: >
                  The status the complaint held before this batch. Also set
                  on failures (except UNKNOWN_COMPLAINT), so the officer can
                  see why an item was refused without a second lookup.
              errorCode:
                allOf:
                  - $ref: "#/components/schemas/TransitionFailureCode"
                nullable: true
                description: Machine-readable failure reason; null on success.
              errorMessage:
                type: string
                nullable: true
                description: Human-readable detail (e.g. "CLOSED is terminal").
            required: [complaintId, success]
        summary:
          type: object
          required: [requested, succeeded, failed]
          properties:
            requested:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
      required: [results, summary]

    ProgressNoteRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 500

    DisputeRequest:
      type: object
      required: [reason, photo]
      properties:
        reason:
          type: string
          description: Why the citizen believes the issue is not actually fixed.
        photo:
          type: string
          format: binary
          description: >
            Required proof that the issue persists — JPEG or PNG, max 5 MB.
            The burden of evidence for a dispute is on the citizen, the same
            way it is for the original complaint. Stored as the next
            `sequence` in the complaint's evidence history; it is never
            routed through an officer's evidence-review verdict, so its
            `verdict` stays permanently null — the admin judges it directly
            when ruling on the dispute.

    DisputeReviewRequest:
      type: object
      required: [verdict, reason]
      properties:
        verdict:
          $ref: "#/components/schemas/DisputeVerdict"
        reason:
          type: string
          description: >
            The admin's justification, always required. Recorded on the
            `status_history` entry — this is the only place the ruling is
            stored; the dispute's evidence row itself is never marked with a
            verdict of its own.

    UpvoteResult:
      type: object
      properties:
        complaintId:
          type: string
        upvoteCount:
          type: integer
        severityLabel:
          $ref: "#/components/schemas/SeverityLabel"
      required: [complaintId, upvoteCount]

    ComplaintOverrideRequest:
      type: object
      description: Admin override — send only the fields to change.
      properties:
        status:
          $ref: "#/components/schemas/ComplaintStatus"
        categoryId:
          type: string
        zoneId:
          type: string
          description: Manually reassign the complaint to a different zone.
        reason:
          type: string
          description: Recommended — recorded in the status history.

    SlaUpdateRequest:
      type: object
      required: [targetHours]
      properties:
        targetHours:
          type: integer
          minimum: 1
          example: 72

    Settings:
      type: object
      properties:
        autoCloseTimeoutHours:
          type: integer
          minimum: 1
          description: How long a RESOLVED complaint waits for citizen confirmation before auto-closing.
          example: 168
      required: [autoCloseTimeoutHours]

    # ---- Gamification ----

    PointsLedgerEntry:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: Positive or negative CSP change.
          example: 50
        reason:
          type: string
          enum:
            - COMPLAINT_CLOSED
            - CLUSTER_MEMBER_CLOSED
            - FIRST_COMPLAINT
            - ON_TIME_BONUS
            - UPVOTE_RECEIVED
            - REJECTED_PENALTY
        complaintId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, amount, reason, createdAt]

    PointsSummary:
      type: object
      properties:
        totalLifetimeCsp:
          type: integer
          example: 245
        currentMonthCsp:
          type: integer
          example: 80
        ledger:
          type: array
          items:
            $ref: "#/components/schemas/PointsLedgerEntry"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required: [totalLifetimeCsp, currentMonthCsp]

    Badge:
      type: object
      properties:
        code:
          type: string
          enum:
            - KARTAVYA_INITIATE
            - STREET_GUARDIAN
            - ZONE_CHAMPION
            - CENTURY_REFORMER
            - CIVIC_HERO
            - SWIFT_REPORTER
        name:
          type: string
          example: Street Guardian
        description:
          type: string
          example: Got 5 complaints fixed.
        earnedAt:
          type: string
          format: date-time
      required: [code, name, earnedAt]

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
          example: 3
        citizenId:
          type: string
        displayName:
          type: string
          description: A public display name/handle (no private profile is exposed).
        points:
          type: integer
        isCurrentUser:
          type: boolean
        isTopThree:
          type: boolean
      required: [rank, citizenId, points]

    LeaderboardResponse:
      type: object
      properties:
        scope:
          type: string
          enum: [zone, city]
        period:
          type: string
          enum: [monthly, all_time]
        generatedAt:
          type: string
          format: date-time
        currentUser:
          allOf:
            - $ref: "#/components/schemas/LeaderboardEntry"
          nullable: true
          description: The caller's own rank, even if not in the visible page.
        data:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
      required: [scope, period, data, pagination]

    # ---- Analytics ----

    AvgResolutionHours:
      type: number
      format: float
      nullable: true
      description: >
        **The one definition of "resolution time", used by every dashboard.**


        For a single complaint it is
        `resolved_at − sla_started_at − sla_paused_seconds`, expressed in
        hours: the time the complaint actually spent as the officer's
        responsibility. It starts when the evidence was accepted and the SLA
        clock began — not when the citizen filed — and it excludes any spell
        in `NEEDS_MORE_EVIDENCE`, exactly like `slaLabel`. Those two numbers
        must never be able to disagree: a zone cannot show every complaint
        `ON_TIME` and an average past its SLA target.


        It deliberately stops at `resolved_at`, not `closed_at`. The wait
        between "officer fixed it" and "citizen confirmed it" belongs to the
        citizen (or to the auto-close timeout) and is not the officer's or the
        zone's performance to answer for.


        The field is the mean over a sample of complaints. Only complaints
        with a non-null `resolved_at` are in the sample, which naturally
        excludes `UNRESOLVABLE` ones and any complaint rejected at evidence
        review (its clock never started). A complaint that was disputed and
        re-resolved counts once, using its **latest** `resolved_at` and its
        total accumulated `sla_paused_seconds`, so the re-fix is paid for.


        `null` — never `0` — when the sample is empty. Each field below states
        which complaints are in its sample.

    CategoryBreakdownItem:
      type: object
      properties:
        categoryId:
          type: string
        categoryName:
          type: string
        count:
          type: integer

    ZoneAnalytics:
      type: object
      properties:
        zoneId:
          type: string
        zoneName:
          type: string
        activeComplaints:
          type: integer
        overdueCount:
          type: integer
        avgResolutionHoursThisMonth:
          allOf:
            - $ref: "#/components/schemas/AvgResolutionHours"
          description: >
            Sample: complaints in this zone whose `resolved_at` falls in the
            current calendar month (server timezone).
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/CategoryBreakdownItem"
      required: [zoneId, activeComplaints, overdueCount]

    ZoneMetrics:
      type: object
      properties:
        zoneId:
          type: string
        zoneName:
          type: string
        pending:
          type: integer
        overdue:
          type: integer
        resolvedThisMonth:
          type: integer
        avgResolutionHours:
          allOf:
            - $ref: "#/components/schemas/AvgResolutionHours"
          description: >
            Sample: complaints in this zone whose `resolved_at` falls in the
            current calendar month — the same set counted by
            `resolvedThisMonth` beside it, so the two columns of the admin
            zone table always describe one population. Identical in meaning to
            `ZoneAnalytics.avgResolutionHoursThisMonth`; the officer and admin
            dashboards must show the same figure for the same zone.
        isHighestOverdue:
          type: boolean
          description: True for the zone(s) with the most overdue complaints (for highlighting).
        topCitizens:
          type: array
          description: Top 3 citizens by CSP in this zone.
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        severityHeat:
          type: object
          description: Counts per severity, for the heatmap grid.
          properties:
            LOW:
              type: integer
            MEDIUM:
              type: integer
            HIGH:
              type: integer
            CRITICAL:
              type: integer

    SystemAnalytics:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        zones:
          type: array
          items:
            $ref: "#/components/schemas/ZoneMetrics"
      required: [generatedAt, zones]

    OfficerPerformance:
      type: object
      properties:
        officerId:
          type: string
        zoneId:
          type: string
        period:
          type: string
        totalHandled:
          type: integer
        onTime:
          type: integer
        delayed:
          type: integer
        overdue:
          type: integer
        unresolvableExcluded:
          type: integer
          description: Count of UNRESOLVABLE complaints excluded from on-time/overdue figures.
        evidenceBreakdown:
          type: object
          properties:
            valid:
              type: integer
            needsMoreEvidence:
              type: integer
            rejected:
              type: integer
        acceptRejectRatio:
          type: number
          format: float
          nullable: true
        avgResolutionHours:
          allOf:
            - $ref: "#/components/schemas/AvgResolutionHours"
          description: >
            Sample: complaints **this officer** resolved — that is, where they
            were the acting officer on the `→ RESOLVED` transition in
            `status_history` — with `resolved_at` inside the requested window
            (`period`, or `dateFrom`/`dateTo`). Attribution follows the
            transition, not `assignedOfficerId`, so reassigning a complaint
            cannot retroactively move finished work between scorecards.
            Cluster members swept to `RESOLVED` by the cascade carry a
            `SYSTEM` actor with no user attached, and are therefore **not**
            in any officer's sample — which is the intended reading, since
            one visit fixing one pothole should count as one resolution
            however many duplicates were filed about it.
      required: [officerId, totalHandled]

    PublicOfficerStats:
      type: object
      description: The only officer info a citizen may see.
      properties:
        officerId:
          type: string
        totalResolved:
          type: integer
      required: [officerId, totalResolved]

    # ---- AI ----

    AiZoneReport:
      type: object
      properties:
        reportId:
          type: string
        zoneId:
          type: string
        status:
          type: string
          enum: [PENDING, READY, FAILED]
          description: PENDING right after triggering, READY when done, FAILED if the AI was unavailable.
        aiAvailable:
          type: boolean
        summary:
          type: string
          nullable: true
          description: The plain-English health summary (present when READY).
        trends:
          type: string
          nullable: true
        hotspots:
          type: string
          nullable: true
        suggestions:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
          nullable: true
      required: [reportId, zoneId, status, aiAvailable]


    Cluster:
      type: object
      description: >
        A group of nearby same-category complaints treated as one physical
        issue. The cluster itself has no status — its state is always derived
        from its members' statuses (see statusSummary), never stored.
      required:
        - id
        - zoneId
        - category
        - reportCount
        - uniqueReporterCount
        - severityScore
        - severityLabel
        - statusSummary
        - centroidLat
        - centroidLng
        - createdAt

      properties:
        id:
          type: string

        zoneId:
          type: string

        category:
          $ref: "#/components/schemas/Category"

        reportCount:
          type: integer
          description: >
            Total member complaints — may include several filed by the same
            citizen.

        uniqueReporterCount:
          type: integer
          description: >
            Distinct citizens in the cluster. This — not reportCount — drives
            severity, so one person filing repeatedly cannot inflate urgency.

        severityScore:
          type: integer
          description: (uniqueReporterCount - 1) * 3 + total upvotes across members.

        severityLabel:
          $ref: "#/components/schemas/SeverityLabel"

        statusSummary:
          type: object
          description: >
            Derived on read, never stored. Maps each ComplaintStatus present
            among the members to how many members currently hold it, e.g.
            {"RESOLVED": 3, "CLOSED": 2, "REOPENED": 1}. Statuses no member
            holds are omitted. This is the only representation of "cluster
            state" — there is deliberately no status field on the cluster.
          additionalProperties:
            type: integer

        centroidLat:
          type: number
          format: float

        centroidLng:
          type: number
          format: float

        createdAt:
          type: string
          format: date-time

    ClusterDetail:
      allOf:
        - $ref: "#/components/schemas/Cluster"

        - type: object
          required: [complaints]
          properties:
            complaints:
              type: array
              description: >
                All current members. Uses the same anonymized Complaint shape
                as everywhere else — reporter identity is never included.
              items:
                $ref: "#/components/schemas/Complaint"

    ClusterListResponse:
      type: object
      required: [data, pagination]

      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"

        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    ZoneSummary:
      type: object

      properties:
        zoneId:
          type: string

        totalComplaints:
          type: integer

        activeComplaints:
          type: integer

        resolvedComplaints:
          type: integer

        totalClusters:
          type: integer

        activeClusters:
          type: integer
