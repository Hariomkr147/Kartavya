[project]
name = "kartavya-backend"
version = "0.1.0"
description = "Kartavya — civic grievance platform API (Flask + SQLAlchemy + SQLite)"
requires-python = ">=3.11"

# Runtime dependencies. Deliberately small: no password-hashing library
# (Werkzeug ships with Flask and provides scrypt), no serialization framework
# (serializers are plain functions — see app/api/), no Celery (APScheduler is
# enough for three in-process jobs, per docs/backend/architecture.md Part 10).
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.6",
    "PyJWT>=2.8",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    # Postgres driver. SQLite stays the default for local work and CI; this is
    # what lets DATABASE_URL point at a hosted Postgres (Neon, Supabase, ...)
    # so deployed data survives a restart. `[binary]` ships a wheel, so no
    # libpq build on Render.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "import-linter>=2.0",
    # tests/contract/ validates live responses against backend/api/openapi.yaml.
    # Both are small, pure-Python packages, and they belong in the DEFAULT dev
    # install rather than behind an extra: a contract-test layer nobody installs
    # catches nothing. Three shipped contract violations (a ledger field named
    # after its column, a ZoneSummary missing two fields, and an invented
    # pagination key) got through precisely because this layer was optional.
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]
# Property-based fuzzing of the whole surface from the spec. Genuinely heavy, so
# it stays opt-in: `pip install -e ".[contract]"`.
contract = [
    "schemathesis>=3.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "domain: pure-rule tests, no database, must stay in the millisecond range",
    "integration: end-to-end journeys driven entirely over HTTP (tests/integration/)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["app"]
